<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crystal Solar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;500&display=swap">
  <style>
    /* ═══════════════════════════════════════════════════
       BASE STYLES
    ═══════════════════════════════════════════════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #010008;
      width: 100vw;
      overflow-x: hidden;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }
    /* Real scrollable height — one tall invisible column.
       The canvas + UI stay fixed; scrolling through this is
       what drives the journey through each planet.         */
    #scrollSpacer {
      position: relative;
      width: 100%;
      height: 2560vh;   /* 8 planets × 320vh of travel each */
      height: 2560dvh;  /* dynamic viewport height — stays in sync with
                            window.innerHeight as mobile browser chrome
                            shows/hides, instead of drifting out of sync
                            with the static `vh` unit while scrolling  */
      pointer-events: none;
    }

    /* ── Hint text ── */
    .hint {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font: 300 9px/1 'Cinzel', serif;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(180, 140, 255, .22);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Sound toggle button ── */
    #sndBtn {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      font: 300 9px/1 'Cinzel', serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(180, 150, 255, .32);
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(180, 150, 255, .18);
      padding: 6px 11px;
      transition: color .3s, border-color .3s;
      z-index: 20;
    }
    @media (max-width: 640px), (pointer: coarse) {
      #sndBtn { padding: 10px 14px; font-size: 10px; }
    }
    #sndBtn:hover { color: rgba(210, 185, 255, .6); border-color: rgba(210, 185, 255, .38); }
    #sndBtn.on   { color: rgba(140, 210, 255, .6); border-color: rgba(140, 210, 255, .35); }

    /* ── Intro veil (fade-in overlay) ── */
    #veil {
      position: fixed;
      inset: 0;
      background: #010008;
      pointer-events: none;
      z-index: 60;
      opacity: 1;
      transition: opacity 2.5s ease-in-out;
    }

    /* ═══════════════════════════════════════════════════
       INFO PANEL — right side, previews whichever planet
       is being travelled toward
    ═══════════════════════════════════════════════════ */
    #infoPanel {
      --accent: 200, 190, 230;
      position: fixed;
      top: 50%;
      right: 22px;
      transform: translateY(-50%);
      width: min(258px, 34vw);
      padding: 18px 18px 16px;
      background: linear-gradient(160deg, rgba(30, 14, 54, .38), rgba(8, 4, 22, .42));
      border: 1px solid rgba(var(--accent), .18);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 26px rgba(var(--accent), .10);
      color: rgba(225, 220, 245, .82);
      font-family: 'Cinzel', serif;
      z-index: 15;
      pointer-events: none;
    }
    #ipTrack {
      height: 2px; width: 100%;
      background: rgba(255, 255, 255, .08);
      border-radius: 2px; overflow: hidden; margin-bottom: 10px;
    }
    #ipTrackFill { height: 100%; width: 0%; border-radius: 2px; background: rgb(var(--accent)); }
    .ip-label {
      font: 300 10px/1 'Cinzel', serif; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(var(--accent), .6); margin-bottom: 10px;
    }
    .ip-index { font: 300 10px/1 'Cinzel', serif; letter-spacing: .2em; color: rgba(200, 195, 220, .5); margin-bottom: 10px; }
    .ip-index .ip-sep { opacity: .5; margin: 0 2px; }
    #ipTitle { font: 500 20px/1.15 'Cinzel', serif; letter-spacing: .04em; color: rgba(235, 225, 255, .96); margin-bottom: 4px; }
    #ipSub { font: 300 9.5px/1 'Cinzel', serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(200, 195, 230, .55); margin-bottom: 12px; }
    #ipDesc { font: 300 12px/1.55 system-ui, sans-serif; color: rgba(220, 215, 240, .72); margin-bottom: 12px; letter-spacing: .01em; }
    #ipFacts { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    #ipFacts li { font: 300 11px/1.4 system-ui, sans-serif; color: rgba(200, 205, 230, .68); padding-left: 12px; position: relative; }
    #ipFacts li::before {
      content: ''; position: absolute; left: 0; top: 6px; width: 4px; height: 4px;
      border-radius: 50%; background: rgba(var(--accent), .65);
    }
    .ip-dots { display: flex; flex-wrap: wrap; gap: 6px; max-width: 130px; }
    .ip-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(180, 150, 255, .22); transition: background .3s, transform .3s; }
    .ip-dots .dot.active { background: rgb(var(--accent)); transform: scale(1.25); }
    @media (max-width: 640px) {
      #infoPanel { width: min(200px, 46vw); padding: 13px 13px 12px; right: calc(12px + env(safe-area-inset-right, 0px)); }
      #ipTitle { font-size: 16px; }
      #ipDesc  { font-size: 10.5px; }
      #ipFacts li { font-size: 9.5px; }
    }

    /* ── Stage nav arrows ── */
    #stageNav {
      position: fixed;
      bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px; z-index: 15;
    }
    #stageNav button {
      font: 300 13px/1 'Cinzel', serif; color: rgba(180, 150, 255, .45);
      background: transparent; border: 1px solid rgba(180, 150, 255, .18);
      border-radius: 50%; width: 30px; height: 30px; cursor: pointer;
      transition: color .25s, border-color .25s, opacity .25s;
    }
    #stageNav button:hover { color: rgba(210, 185, 255, .7); border-color: rgba(210, 185, 255, .4); }
    @media (max-width: 640px), (pointer: coarse) {
      #stageNav button { width: 40px; height: 40px; font-size: 15px; }
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>
  <div class="hint">kéo để xoay · cuộn để lặn sâu qua từng hành tinh</div>
  <div id="sndBtn">♪ sound</div>

  <div id="infoPanel">
    <div id="ipTrack"><div id="ipTrackFill"></div></div>
    <div class="ip-label">Sắp tới</div>
    <div class="ip-index"><span id="ipCur">1</span><span class="ip-sep">/</span><span id="ipTotal">8</span></div>
    <div id="ipTitle"></div>
    <div id="ipSub"></div>
    <p id="ipDesc"></p>
    <ul id="ipFacts"></ul>
    <div class="ip-dots">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </div>

  <div id="stageNav">
    <button id="navPrev" aria-label="Trước">‹</button>
    <button id="navNext" aria-label="Sau">›</button>
  </div>

  <div id="veil"></div>

  <div id="scrollSpacer" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════
       VEIL REMOVAL
  ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      function fadeVeil() {
        var v = document.getElementById('veil');
        if (!v) return;
        v.style.opacity = '0';
        setTimeout(function () { if (v.parentNode) v.parentNode.removeChild(v); }, 2800);
      }
      setTimeout(fadeVeil, 400);
    })();
  </script>

  <!-- Three.js r134 from cdnjs (allowed CDN in artifact sandbox) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- ═══════════════════════════════════════════════════
       MAIN SCENE
  ═══════════════════════════════════════════════════ -->
  <script>
  (function () {
    if (typeof THREE === 'undefined') {
      console.error('[scene] THREE.js failed to load — cannot render scene.');
      return;
    }

    /* ═══════════════════════════════════════════
       RENDERER + CAMERA
    ═══════════════════════════════════════════ */
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.sortObjects = true;

    function restFov() {
      const aspect = W() / H();
      return aspect < 0.8 ? 52 : aspect < 1.05 ? 46 : 38;
    }

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(restFov(), W() / H(), 0.05, 120);
    camera.position.set(0, 0, 3.3);
    camera.lookAt(0, 0, 0);

    /* ═══════════════════════════════════════════
       SHARED GLSL
    ═══════════════════════════════════════════ */
    const COMMON = /* glsl */ `
      float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5); }
      float h3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5); }
      float n2(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(h2(i),             h2(i + vec2(1.0, 0.0)), f.x),
          mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }
      float fbm(vec2 p) { return 0.5 * n2(p) + 0.25 * n2(p * 2.0) + 0.125 * n2(p * 4.0); }
      float fbm3(vec3 p) { return 0.5 * n2(p.xy) + 0.25 * n2(p.yz * 2.0) + 0.125 * n2(p.xz * 4.0); }
      /* Ridged noise: folds value-noise around its midpoint into a
         sharp crease instead of a soft hill — breaks the "soft cloud"
         signature of plain value-noise and reads as rock/ridge/coast
         detail instead. Slightly irrational octave multipliers avoid
         the bands lining up into a visible repeat.               */
      float ridge2(vec2 p) { return 1.0 - abs(n2(p) * 2.0 - 1.0); }
      float fbmRidge3(vec3 p) {
        return 0.55 * ridge2(p.xy) + 0.28 * ridge2(p.yz * 2.07) + 0.14 * ridge2(p.xz * 4.13);
      }
      /* Screen-space film grain — flickers frame to frame like real
         grain, breaking up the smooth-gradient "airbrushed CG" look */
      float grain(vec2 fragCoord, float t) {
        return h2(fragCoord + fract(t) * 97.0) - 0.5;
      }
      vec2 voronoi2(vec2 p) {
        vec2 ip = floor(p);
        vec2 fp = fract(p);
        float bd = 8.0;
        float bid = 0.0;
        vec2 g, o, r; float d, s;
        g = vec2(-1.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2(-1.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2(-1.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        return vec2(sqrt(bd), bid);
      }
      vec2 cellular3(vec3 p) {
        vec2 a = voronoi2(p.xy);
        vec2 b = voronoi2(p.yz);
        vec2 c = voronoi2(p.xz);
        float m = min(a.x, min(b.x, c.x));
        float id = mix(mix(c.y, b.y, step(b.x, c.x)), a.y, step(a.x, min(b.x, c.x)));
        return vec2(m, id);
      }
      float craterBowl(vec3 n, vec3 center, float radius, float depth) {
        float d = length(n - center) / radius;
        float bowl = smoothstep(1.0, 0.0, d);
        float rim  = exp(-pow((d - 1.05) * 6.0, 2.0));
        return depth * (rim * 0.45 - bowl);
      }
      float starburst(vec3 N, vec3 V, vec3 L, float sh) {
        vec3 H    = normalize(L + V);
        float core = pow(max(dot(N, H), 0.0), sh);
        vec3 R    = normalize(cross(V, vec3(0.0, 1.0, 0.001)));
        vec3 U    = normalize(cross(R, V));
        vec3 refl = reflect(-V, N);
        float rr  = dot(refl, R);
        float ru  = dot(refl, U);
        float ld  = max(0.0, dot(refl, L));
        float spk =
          exp(-rr*rr*150.0) * exp(-ru*ru*2800.0) +
          exp(-ru*ru*150.0) * exp(-rr*rr*2800.0) +
          exp(-(rr+ru)*(rr+ru)*220.0) * exp(-(rr-ru)*(rr-ru)*2800.0) +
          exp(-(rr-ru)*(rr-ru)*220.0) * exp(-(rr+ru)*(rr+ru)*2800.0);
        return core + spk * 0.5 * ld;
      }
    `;

    /* ═══════════════════════════════════════════
       BACKGROUND
    ═══════════════════════════════════════════ */
    const bgMat = new THREE.ShaderMaterial({
      depthWrite: false,
      uniforms: { uTime: { value: 0 }, uWorldT: { value: 0 } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }
      `,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uWorldT;
        ${COMMON}
        void main() {
          vec2 uv = vUv - 0.5;
          float t = uTime * 0.0012;
          vec3 col = mix(vec3(0.030, 0.010, 0.115), vec3(0.008, 0.003, 0.045), length(uv) * 1.8);
          float nc1 = fbm(uv * 2.1 + vec2(t, 0.0));
          float nc2 = fbm(uv * 3.7 + nc1 * 0.4 + vec2(0.1, t * 1.1));
          float nc3 = fbm(uv * 6.2 + nc2 * 0.26 - vec2(t * 0.9, t * 1.3));
          col += vec3(0.42, 0.05, 0.72) * smoothstep(0.30, 0.82, nc1) * smoothstep(0.52, 0.0, length(uv + vec2(-0.08, 0.07))) * 0.28;
          col += vec3(0.04, 0.52, 0.82) * smoothstep(0.36, 0.80, nc2) * smoothstep(0.48, 0.0, length(uv + vec2(0.20, -0.14))) * 0.20;
          col += vec3(0.06, 0.22, 0.88) * smoothstep(0.44, 0.82, nc3) * 0.11;
          col += vec3(0.80, 0.06, 0.58) * smoothstep(0.60, 0.96, nc1 * nc2) * 0.10;
          col += vec3(0.70, 0.36, 0.06) * smoothstep(0.30, 0.0, length(uv)) * 0.15;
          float mwD    = uv.x * 0.72 + uv.y * 0.54;
          float mwFall = smoothstep(0.34, 0.0, abs(mwD));
          float mwN1   = fbm(uv * 5.4 + vec2(t * 0.28, 0.0)) * fbm(uv * 10.2 + vec2(-0.22, t * 0.40));
          float mwN2   = fbm((uv + mwN1 * 0.10) * 6.8 + vec2(t * 0.16, t * 0.23));
          float mwBand = mwFall * (mwN1 * 0.74 + mwN2 * 0.26);
          col += vec3(0.38, 0.42, 0.74) * mwBand * 0.92;
          col += vec3(0.58, 0.54, 0.94) * smoothstep(0.14, 0.0, abs(mwD)) * mwN1 * 0.68;
          col += vec3(0.11, 0.09, 0.32) * mwFall * 0.28;
          col += vec3(0.70, 0.66, 0.98) * smoothstep(0.07, 0.0, abs(mwD)) * smoothstep(0.32, 0.54, mwN2) * 0.52;

          vec2 gA = vUv * vec2(212.0, 136.0);
          vec2 cA = floor(gA); vec2 fA = fract(gA);
          float rA1 = h2(cA), rA2 = h2(cA+vec2(41.2,83.7)), rA3 = h2(cA+vec2(22.9,61.4));
          float rA4 = h2(cA+vec2(93.5,37.2)), rA5 = h2(cA+vec2(57.8,15.1)), rA6 = h2(cA+vec2(19.3,78.6));
          float visA = step(0.50, rA1);
          float dA = length(fA - vec2(rA2, rA3));
          float szA = 0.0020 + rA4 * 0.0095;
          float blA = 0.48 + 0.52 * sin(uTime * (0.20 + rA6 * 1.65) + rA1 * 22.5);
          float mbA = 1.0 + mwBand * 3.0;
          float bA = smoothstep(szA*2.0, 0.0, dA) * blA * (0.08 + rA4*0.85) * mbA * visA;
          vec3 scA = rA5 < 0.20 ? mix(vec3(0.42,0.58,1.0), vec3(0.76,0.88,1.0), rA4) :
                     rA5 < 0.62 ? mix(vec3(0.86,0.91,1.0), vec3(1.0,1.0,0.94), rA4) :
                     rA5 < 0.82 ? mix(vec3(1.0,0.92,0.73), vec3(1.0,0.84,0.56), rA4) : vec3(1.0,0.66,0.42);
          col += scA * bA;
          float flareA = step(0.80, rA4);
          col += scA * (exp(-abs(fA.x-rA2)*230.0)*exp(-dA*dA*360.0) + exp(-abs(fA.y-rA3)*230.0)*exp(-dA*dA*360.0)) * bA * 2.1 * flareA;

          vec2 gB = vUv * vec2(91.0, 58.0);
          vec2 cB = floor(gB); vec2 fB = fract(gB);
          float rB1 = h2(cB+vec2(5.1,8.7)), rB2 = h2(cB+vec2(14.5,71.3)), rB3 = h2(cB+vec2(62.1,29.8));
          float rB4 = h2(cB+vec2(43.8,57.2)), rB6 = h2(cB+vec2(33.7,91.4));
          float visB = step(0.68, rB1);
          float dB = length(fB - vec2(rB2, rB3));
          float szB = 0.004 + rB4 * 0.015;
          float blB = 0.55 + 0.45 * sin(uTime * (0.28 + rB6*1.4) + rB1*18.0);
          float mbB = 1.0 + mwBand * 2.2;
          float bB = smoothstep(szB*2.0, 0.0, dB) * blB * (0.14 + rB4*0.72) * mbB * visB;
          vec3 scB = mix(vec3(0.88,0.93,1.0), vec3(1.0,0.96,0.88), rB4);
          col += scB * bB;
          col += scB * (exp(-abs(fB.x-rB2)*150.0)*exp(-dB*dB*210.0) + exp(-abs(fB.y-rB3)*150.0)*exp(-dB*dB*210.0)) * bB * 3.2;

          vec2 gC = vUv * vec2(35.0, 22.0);
          vec2 cC = floor(gC); vec2 fC = fract(gC);
          float rC1 = h2(cC+vec2(11.3,55.8)), rC2 = h2(cC+vec2(77.4,18.2)), rC3 = h2(cC+vec2(28.6,84.5));
          float rC4 = h2(cC+vec2(63.1,42.9)), rC5 = h2(cC+vec2(9.8,67.3));
          float visC = step(0.80, rC1);
          float dC = length(fC - vec2(rC2, rC3));
          float szC = 0.008 + rC4 * 0.022;
          float blC = 0.60 + 0.40 * sin(uTime * (0.35 + rC5*1.2) + rC1*14.0);
          float bC = smoothstep(szC*2.0, 0.0, dC) * blC * (0.25 + rC4*0.75) * (1.0 + mwBand*1.8) * visC;
          vec3 scC = mix(vec3(1.0,0.95,0.90), vec3(0.80,0.90,1.0), rC4);
          col += scC * bC;
          col += scC * (exp(-abs(fC.x-rC2)*80.0)*exp(-dC*dC*120.0) + exp(-abs(fC.y-rC3)*80.0)*exp(-dC*dC*120.0)) * bC * 4.5;

          vec2 fa = vec2(0.22,0.34), fb = vec2(-0.31,0.18), fc = vec2(0.40,-0.23);
          vec2 fd = vec2(-0.17,-0.41), fe = vec2(0.11,0.45), ff = vec2(-0.44,-0.07);
          float ba = 0.55+0.45*sin(uTime*0.42+0.8), bb = 0.55+0.45*sin(uTime*0.58+2.3), bc = 0.55+0.45*sin(uTime*0.35+4.1);
          float bd = 0.55+0.45*sin(uTime*0.65+1.5), be = 0.55+0.45*sin(uTime*0.48+3.7), bf = 0.55+0.45*sin(uTime*0.52+5.2);
          col += vec3(0.90,0.94,1.0) * smoothstep(0.007,0.0,length(uv-fa)) * ba * 2.2;
          col += vec3(0.86,0.90,1.0) * smoothstep(0.005,0.0,length(uv-fb)) * bb * 1.9;
          col += vec3(0.95,0.92,1.0) * smoothstep(0.008,0.0,length(uv-fc)) * bc * 2.4;
          col += vec3(0.90,0.88,1.0) * smoothstep(0.005,0.0,length(uv-fd)) * bd * 1.8;
          col += vec3(0.88,0.93,1.0) * smoothstep(0.006,0.0,length(uv-fe)) * be * 2.0;
          col += vec3(0.96,0.95,1.0) * smoothstep(0.009,0.0,length(uv-ff)) * bf * 2.6;
          col += vec3(0.90,0.94,1.0) * (exp(-(uv.x-fa.x)*(uv.x-fa.x)*1800.0)*exp(-(uv.y-fa.y)*(uv.y-fa.y)*6200.0) + exp(-(uv.y-fa.y)*(uv.y-fa.y)*1800.0)*exp(-(uv.x-fa.x)*(uv.x-fa.x)*6200.0)) * ba * 0.55;
          col += vec3(0.95,0.92,1.0) * (exp(-(uv.x-fc.x)*(uv.x-fc.x)*1800.0)*exp(-(uv.y-fc.y)*(uv.y-fc.y)*6200.0) + exp(-(uv.y-fc.y)*(uv.y-fc.y)*1800.0)*exp(-(uv.x-fc.x)*(uv.x-fc.x)*6200.0)) * bc * 0.60;
          col += vec3(0.96,0.95,1.0) * (exp(-(uv.x-ff.x)*(uv.x-ff.x)*1800.0)*exp(-(uv.y-ff.y)*(uv.y-ff.y)*6200.0) + exp(-(uv.y-ff.y)*(uv.y-ff.y)*1800.0)*exp(-(uv.x-ff.x)*(uv.x-ff.x)*6200.0)) * bf * 0.70;

          /* World tint: whichever planet we're nearest to washes the
             nebula a touch in its own hue (8 stops, wraps) */
          float wt = uWorldT;
          vec3 tints[8];
          tints[0] = vec3(0.14, 0.10, 0.06); tints[1] = vec3(0.16, 0.12, 0.04);
          tints[2] = vec3(0.02, 0.09, 0.14); tints[3] = vec3(0.18, 0.06, 0.02);
          tints[4] = vec3(0.14, 0.09, 0.03); tints[5] = vec3(0.15, 0.12, 0.06);
          tints[6] = vec3(0.03, 0.13, 0.13); tints[7] = vec3(0.03, 0.05, 0.16);
          vec3 worldTint = vec3(0.0);
          worldTint += tints[0] * (clamp(1.0-abs(wt-0.0),0.0,1.0) + clamp(1.0-abs(wt-8.0),0.0,1.0));
          worldTint += tints[1] * clamp(1.0-abs(wt-1.0),0.0,1.0);
          worldTint += tints[2] * clamp(1.0-abs(wt-2.0),0.0,1.0);
          worldTint += tints[3] * clamp(1.0-abs(wt-3.0),0.0,1.0);
          worldTint += tints[4] * clamp(1.0-abs(wt-4.0),0.0,1.0);
          worldTint += tints[5] * clamp(1.0-abs(wt-5.0),0.0,1.0);
          worldTint += tints[6] * clamp(1.0-abs(wt-6.0),0.0,1.0);
          worldTint += tints[7] * clamp(1.0-abs(wt-7.0),0.0,1.0);
          col += worldTint * 0.6;

          col *= smoothstep(1.0, 0.26, length(uv));
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
    bgMesh.renderOrder = -10;
    scene.add(bgMesh);

    /* ═══════════════════════════════════════════
       COSMIC GROUP
    ═══════════════════════════════════════════ */
    const cosmicGroup = new THREE.Group();
    scene.add(cosmicGroup);

    const STARS3D = 5000;
    const s3P = new Float32Array(STARS3D * 3);
    const s3C = new Float32Array(STARS3D * 3);
    for (let i = 0; i < STARS3D; i++) {
      const r = 6 + Math.pow(Math.random(), 0.38) * 16;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      s3P[i*3] = r*Math.sin(ph)*Math.cos(th); s3P[i*3+1] = r*Math.sin(ph)*Math.sin(th); s3P[i*3+2] = r*Math.cos(ph);
      const t2 = Math.random(); const b = 0.04 + Math.random()*0.28;
      let rc, gc, bc;
      if (t2 < 0.20) { rc=(0.40+Math.random()*0.3)*b; gc=(0.60+Math.random()*0.2)*b; bc=b; }
      else if (t2 < 0.70) { rc=(0.87+Math.random()*0.13)*b; gc=(0.90+Math.random()*0.10)*b; bc=(0.93+Math.random()*0.07)*b; }
      else if (t2 < 0.88) { rc=b; gc=(0.85+Math.random()*0.12)*b; bc=(0.55+Math.random()*0.2)*b; }
      else { rc=b; gc=(0.50+Math.random()*0.22)*b; bc=(0.32+Math.random()*0.2)*b; }
      s3C[i*3]=rc; s3C[i*3+1]=gc; s3C[i*3+2]=bc;
    }
    const s3Geo = new THREE.BufferGeometry();
    s3Geo.setAttribute('position', new THREE.BufferAttribute(s3P, 3));
    s3Geo.setAttribute('color', new THREE.BufferAttribute(s3C, 3));
    const starCloud = new THREE.Points(s3Geo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.030, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    starCloud.renderOrder = -4;
    cosmicGroup.add(starCloud);

    const MW = 7000;
    const mwP = new Float32Array(MW * 3);
    const mwC = new Float32Array(MW * 3);
    for (let i = 0; i < MW; i++) {
      const r = 3 + Math.pow(Math.random(), 0.32) * 15;
      const theta = Math.random() * Math.PI * 2;
      const height = (Math.random()-0.5)*0.28/(1+r*0.07);
      mwP[i*3]=r*Math.cos(theta); mwP[i*3+1]=height; mwP[i*3+2]=r*Math.sin(theta);
      const density = Math.max(0, 1-(r-3)/15);
      const bright = (0.04+Math.random()*0.32)*density;
      const ct = Math.random(); let rc, gc, bc;
      if (ct < 0.28) { rc=(0.38+Math.random()*0.28)*bright; gc=(0.58+Math.random()*0.24)*bright; bc=bright; }
      else if (ct < 0.72) { rc=(0.84+Math.random()*0.16)*bright; gc=(0.88+Math.random()*0.12)*bright; bc=bright; }
      else if (ct < 0.88) { rc=bright; gc=(0.87+Math.random()*0.13)*bright; bc=(0.64+Math.random()*0.22)*bright; }
      else { rc=bright; gc=(0.68+Math.random()*0.22)*bright; bc=(0.42+Math.random()*0.2)*bright; }
      mwC[i*3]=rc; mwC[i*3+1]=gc; mwC[i*3+2]=bc;
    }
    const mwGeo = new THREE.BufferGeometry();
    mwGeo.setAttribute('position', new THREE.BufferAttribute(mwP, 3));
    mwGeo.setAttribute('color', new THREE.BufferAttribute(mwC, 3));
    const milkyWayGrp = new THREE.Group();
    milkyWayGrp.rotation.x = Math.PI/3.0; milkyWayGrp.rotation.z = 0.52;
    cosmicGroup.add(milkyWayGrp);
    const mwPoints = new THREE.Points(mwGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.025, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    mwPoints.renderOrder = -3;
    milkyWayGrp.add(mwPoints);

    const DUST = 500;
    const dPos = new Float32Array(DUST * 3);
    const dCol = new Float32Array(DUST * 3);
    const dPal = [[0.55,0.12,0.95],[0.08,0.52,0.95],[0.00,0.88,0.78],[0.92,0.12,0.62],[1.00,0.72,0.18],[0.32,0.72,1.00]];
    for (let i = 0; i < DUST; i++) {
      const r = 3 + Math.random()*9;
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      dPos[i*3]=r*Math.sin(ph)*Math.cos(th); dPos[i*3+1]=r*Math.sin(ph)*Math.sin(th); dPos[i*3+2]=r*Math.cos(ph)-5;
      const c = dPal[Math.floor(Math.random()*dPal.length)];
      const b = 0.06+Math.random()*0.22;
      dCol[i*3]=c[0]*b; dCol[i*3+1]=c[1]*b; dCol[i*3+2]=c[2]*b;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
    dustGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
    const dustPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.04, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    dustPoints.renderOrder = -3;
    cosmicGroup.add(dustPoints);

    const asteroidVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      void main() {
        vN = normalize(normalMatrix * normal); vP = position;
        vWP = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const asteroidFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.5);
        float rock = fbm3(vP*5.0) + fbm3(vP*11.0)*0.5 + fbm3(vP*22.0)*0.25;
        rock = rock*0.5 + 0.5;
        vec3 col = mix(vec3(0.10,0.08,0.07), vec3(0.22,0.18,0.14), clamp(rock,0.0,1.0));
        col += step(0.76, rock) * 0.10;
        vec3 L = normalize(vec3(0.8,1.4,2.0));
        col += pow(max(dot(N, normalize(L+V)), 0.0), 28.0) * 0.22;
        col += mix(vec3(0.40,0.07,0.72), vec3(0.06,0.38,0.85), fbm3(vP*1.5)) * fr * 0.58;
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const aOrbits = [
      [1.55,0.85,0.30,0.016,0.5,0.092],[2.08,-0.48,0.72,0.011,2.2,0.120],
      [2.62,0.22,-0.58,0.0075,3.9,0.105],[1.82,1.18,0.15,0.014,1.4,0.072],
      [3.10,-0.28,0.84,0.006,3.6,0.140],[1.68,0.62,-0.42,0.019,0.9,0.082],
      [2.35,-0.88,0.52,0.009,2.8,0.115],[2.80,0.38,1.05,0.008,5.0,0.095],
    ];
    const asteroidPivots = [];
    aOrbits.forEach(([orbitR, tX, tZ, spd, ang, sz]) => {
      const mat = new THREE.ShaderMaterial({ side: THREE.FrontSide, uniforms: {}, vertexShader: asteroidVS, fragmentShader: asteroidFS });
      const geo = new THREE.SphereGeometry(sz, 7, 7);
      const pos = geo.attributes.position;
      for (let j = 0; j < pos.count; j++) {
        const x=pos.getX(j), y=pos.getY(j), z=pos.getZ(j);
        const r=Math.sqrt(x*x+y*y+z*z), d=1+(Math.random()-0.5)*0.72;
        pos.setXYZ(j, x/r*r*d, y/r*r*d, z/r*r*d);
      }
      pos.needsUpdate = true; geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = orbitR;
      mesh.userData = { rx: 0.003+Math.random()*0.006, rz: 0.002+Math.random()*0.005 };
      const pivot = new THREE.Group();
      pivot.rotation.x = tX; pivot.rotation.z = tZ; pivot.rotation.y = ang;
      pivot.add(mesh);
      cosmicGroup.add(pivot);
      asteroidPivots.push({ pivot, spd, mesh });
    });

    const N_MET = 10;
    const ACTIVE_DUR = 12.0;
    const metColors = [[1.00,0.96,0.82],[0.62,0.88,1.00],[0.42,1.00,0.92],[1.00,0.52,0.88],[0.80,0.52,1.00],[1.00,0.88,0.42],[0.72,1.00,0.58],[0.90,0.78,1.00]];
    const tailPos = new Float32Array(N_MET*6), tailCol = new Float32Array(N_MET*6);
    const headPos = new Float32Array(N_MET*3), headCol = new Float32Array(N_MET*3);
    const metData = [];
    for (let m = 0; m < N_MET; m++) {
      const ang = Math.random()*Math.PI*2, slope = (Math.random()-0.5)*0.5-0.08;
      let dx=Math.cos(ang), dy=Math.sin(ang)+slope, dz=(Math.random()-0.5)*0.12;
      const dl=Math.sqrt(dx*dx+dy*dy+dz*dz); dx/=dl; dy/=dl; dz/=dl;
      metData.push({
        dx, dy, dz, speed: 0.28+Math.random()*0.60, trail: 5.5+Math.random()*7.5,
        period: 15+Math.random()*22, phase: Math.random()*40,
        sx: -dx*(6+Math.random()*5), sy: -dy*(6+Math.random()*5)+(Math.random()-0.5)*3,
        sz: -1+Math.random()*4, bright: 0.65+Math.random()*0.35, col: metColors[m % metColors.length],
      });
    }
    const tailGeo = new THREE.BufferGeometry();
    tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
    tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
    const meteorLines = new THREE.LineSegments(tailGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    meteorLines.renderOrder = 9;
    cosmicGroup.add(meteorLines);
    const headGeo = new THREE.BufferGeometry();
    headGeo.setAttribute('position', new THREE.BufferAttribute(headPos, 3));
    headGeo.setAttribute('color', new THREE.BufferAttribute(headCol, 3));
    const meteorHeads = new THREE.Points(headGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.20, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, sizeAttenuation: true,
    }));
    meteorHeads.renderOrder = 9;
    cosmicGroup.add(meteorHeads);

    /* ═══════════════════════════════════════════
       HERO STAGES — 8 planets, one dived into at a
       time. Every solid body displaces its own
       geometry along a noise height field and
       reconstructs the normal by finite differences.
    ═══════════════════════════════════════════ */
    const heroRoot = new THREE.Group();
    heroRoot.rotation.x = -0.30;
    heroRoot.rotation.z = 0.12;
    scene.add(heroRoot);

    const heroVS_plain = /* glsl */ `
      varying vec3 vN, vWP, vP;
      void main() {
        vN = normalize(normalMatrix * normal); vP = position;
        vWP = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const heroDisplaceMain = /* glsl */ `
      void main() {
        vec3 n0 = normalize(position);
        vec3 up = abs(n0.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 t1 = normalize(cross(n0, up));
        vec3 t2 = normalize(cross(n0, t1));
        float eps = 0.01;
        float h0 = heroHeight(position);
        float h1 = heroHeight(position + t1 * eps);
        float h2 = heroHeight(position + t2 * eps);
        vec3 dp0 = position + n0 * h0;
        vec3 dp1 = position + t1 * eps + n0 * h1;
        vec3 dp2 = position + t2 * eps + n0 * h2;
        vec3 faceN = normalize(cross(dp1 - dp0, dp2 - dp0));
        vec3 objN  = normalize(mix(normal, faceN, 0.85));
        vN  = normalize(normalMatrix * objN);
        vP  = position;
        vWP = (modelMatrix * vec4(dp0, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(dp0, 1.0);
      }
    `;
    function heroMaterial(vs, fs, blending) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: blending || THREE.NormalBlending,
        uniforms: { uTime: { value: 0 }, uFade: { value: 0 } },
        vertexShader: vs, fragmentShader: fs,
      });
    }

    /* ═══════════════════════════════════════════
       SUN — the actual light source, always somewhere
       out in the depths. Not a hero stage: it never
       becomes a focused planet, it just recedes/returns
       as uSunFade tracks how far into the journey we are.
    ═══════════════════════════════════════════ */
    const SUN_POS = new THREE.Vector3(0, 0, -18);

    const sunBodyMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uSunFade: { value: 1 } },
      vertexShader: heroVS_plain,
      fragmentShader: /* glsl */ `
        varying vec3 vN, vWP, vP;
        uniform float uTime, uSunFade;
        ${COMMON}
        void main() {
          vec3 col = mix(vec3(1.0, 0.55, 0.05), vec3(1.0, 0.92, 0.45),
                          fbm3(vP * 3.0 + vec3(uTime * 0.04, 0.0, 0.0)));
          col += vec3(1.0, 0.85, 0.4) * cellular3(vP * 8.0).x * 0.12;
          /* It IS the light — no lighting equation, just emission */
          gl_FragColor = vec4(col * 2.2, uSunFade);
        }
      `,
    });
    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), sunBodyMat);

    function makeCoronaShell(radius, innerCol, outerCol, opacFactor) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: { uFade: { value: 1 }, uShellR: { value: radius } },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform float uFade, uShellR;
          void main() {
            float dist = length(vP) / uShellR;
            float fr = pow(max(0.0, 1.0 - dist), 2.5);
            vec3 coronaCol = mix(${innerCol}, ${outerCol}, dist);
            gl_FragColor = vec4(coronaCol, fr * ${opacFactor} * uFade);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
    }
    const coronaShells = [
      makeCoronaShell(1.3, 'vec3(1.0, 0.6, 0.1)', 'vec3(0.8, 0.3, 0.0)', 0.08),
      makeCoronaShell(1.7, 'vec3(1.0, 0.6, 0.1)', 'vec3(0.8, 0.3, 0.0)', 0.08),
      makeCoronaShell(2.4, 'vec3(1.0, 0.4, 0.05)', 'vec3(1.0, 0.4, 0.05)', 0.04),
    ];

    const sunGroup = new THREE.Group();
    sunGroup.position.copy(SUN_POS);
    sunGroup.add(sunMesh);
    coronaShells.forEach(s => sunGroup.add(s));
    heroRoot.add(sunGroup);

    /* Four solar flares orbiting the limb — simple animated point sprites */
    const sunFlares = [];
    for (let i = 0; i < 4; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
      const mat = new THREE.PointsMaterial({
        color: 0xff6600, size: 0.35, transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
      });
      const pts = new THREE.Points(geo, mat);
      heroRoot.add(pts);
      sunFlares.push({ pts, mat, i });
    }

    const sunMats = [sunBodyMat, ...coronaShells.map(s => s.material)];

    /* ── Mercury & Mars — shared "rocky, cratered" body ── */
    const rockyCraterCalls = /* glsl */ `
      craterBowl(n, normalize(vec3( 0.55, 0.35, 0.70)), 0.34, 1.0) +
      craterBowl(n, normalize(vec3(-0.45, 0.60,-0.30)), 0.22, 0.8) +
      craterBowl(n, normalize(vec3( 0.15,-0.75, 0.45)), 0.28, 0.85) +
      craterBowl(n, normalize(vec3(-0.65,-0.25,-0.55)), 0.18, 0.65) +
      craterBowl(n, normalize(vec3( 0.75,-0.15,-0.35)), 0.15, 0.55)
    `;
    const rockySmallCalc = /* glsl */ `
      vec2 scV = cellular3(p * 6.5);
      float scOn   = step(0.5, scV.y);
      float scSize = 0.28 + scV.y * 0.30;
      float scBowl = smoothstep(scSize, 0.0, scV.x);
      float scRim  = exp(-pow((scV.x - scSize * 1.15) * 14.0, 2.0));
      float small  = scOn * (scRim * 0.30 - scBowl);
    `;
    const rockyVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        vec3 n = normalize(p);
        float rough = (fbm3(p * 9.0) - 0.5) * 0.07 + (fbmRidge3(p * 20.0) - 0.5) * 0.05;
        float craters = ${rockyCraterCalls};
        ${rockySmallCalc}
        return rough * 0.06 + craters * 0.044 + small * 0.017;
      }
      ${heroDisplaceMain}
    `;
    const rockyFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade, uPolar;
      uniform vec3 uBaseLow, uBaseHigh, uRimCol;
      uniform float uRimStrength;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 n = normalize(vP);
        vec3 p = vP;
        float alt = fbm3(vP * 4.0) * 0.5 + 0.5;
        vec3 base = mix(uBaseLow, uBaseHigh, alt);
        float craters = ${rockyCraterCalls};
        base *= 1.0 - clamp(-craters, 0.0, 1.0) * 0.40;
        base += clamp(craters, 0.0, 1.0) * 0.08;
        ${rockySmallCalc}
        base *= 1.0 - clamp(-small, 0.0, 1.0) * 0.30;
        base += clamp(small, 0.0, 1.0) * 0.06;
        float polarCap = smoothstep(0.80, 0.94, abs(vP.y)) * uPolar;
        base = mix(base, vec3(0.92, 0.94, 0.98), polarCap);
        /* Ridged high-frequency grit — rock, not cloud */
        float grit = fbmRidge3(vP * 34.0) - 0.5;
        base *= 0.90 + grit * 0.22;
        /* Harsh single-sun terminator — near-black shadow side, like
           real airless-body photography, not a soft ambient wash    */
        vec3 lit = base * (0.028 + lambert * 1.20);
        /* Rim strength/color set per body — Mercury (no air) gets
           almost none; Mars gets a thin dusty haze, not a glow      */
        float fr = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        lit += uRimCol * fr * uRimStrength;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.014) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `;
    function makeRockyMat(baseLow, baseHigh, polar, rimCol, rimStrength) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false,
        uniforms: {
          uTime: { value: 0 }, uFade: { value: 0 }, uPolar: { value: polar },
          uBaseLow: { value: new THREE.Vector3(...baseLow) },
          uBaseHigh: { value: new THREE.Vector3(...baseHigh) },
          uRimCol: { value: new THREE.Vector3(...rimCol) },
          uRimStrength: { value: rimStrength },
        },
        vertexShader: rockyVS, fragmentShader: rockyFS,
      });
    }
    /* Mercury: no atmosphere — almost no rim, just a hint of dust glint */
    const mercuryMat = makeRockyMat([0.40, 0.40, 0.42], [0.72, 0.72, 0.74], 0.0, [0.55, 0.53, 0.52], 0.035);
    /* Mars: real but very thin CO2 atmosphere — a faint dusty pink-tan haze, not a glow */
    const marsMat    = makeRockyMat([0.42, 0.15, 0.06], [0.86, 0.42, 0.20], 1.0, [0.82, 0.52, 0.38], 0.11);

    /* ── Venus — thick smooth swirling cloud deck ── */
    const venusMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        vec3 warp = vec3(
          fbm3(p * 2.0 + vec3(1.0, 0.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 1.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 0.0, 1.0))
        ) - 0.5;
        vec3 wp = p + warp * 1.1;
        float bands = fbm3(wp * 3.0 + vec3(uTime * 0.01, 0.0, 0.0)) * 0.6
                    + fbm3(wp * 7.0 - vec3(0.0, uTime * 0.008, 0.0)) * 0.4;
        float ridges = fbmRidge3(wp * 9.0 - vec3(0.0, 0.0, uTime * 0.012)) - 0.5;
        vec3 base = mix(vec3(0.74, 0.42, 0.14), vec3(0.95, 0.68, 0.32), bands);
        base *= 0.90 + ridges * 0.22;
        /* Thick global atmosphere means Venus barely dims at the
           terminator in reality — a lower floor than an airless body,
           but still darker than the old flat "always half-lit" look */
        vec3 lit = base * (0.16 + lambert * 0.86);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
        lit += vec3(1.0, 0.78, 0.42) * fr * 0.32;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.012) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);

    /* ── Earth — real mountains on land, swirling clouds, city lights ── */
    const earthLandCalc = /* glsl */ `
      float landBase = fbm3(p * 2.6 + vec3(3.1, 1.7, 0.0));
      float landEdge = fbm3(p * 7.5 + vec3(1.4, 0.2, 2.6)) * 0.16;
      float land = smoothstep(0.46, 0.52, landBase + landEdge);
    `;
    const earthCloudCalc = /* glsl */ `
      vec3 warp = vec3(
        fbm3(p * 3.0 + vec3(1.0, 0.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 1.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 0.0, 1.0))
      ) - 0.5;
      vec3 wp = p + warp * 0.7;
      float cloudN = fbm3(wp * 4.0 + vec3(uTime * 0.02, 0.0, 0.0))
                   * fbm3(wp * 8.0 - vec3(0.0, uTime * 0.015, 0.0));
      float cloud = smoothstep(0.28, 0.60, cloudN);
    `;
    const earthVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        ${earthLandCalc}
        float terrain = fbm3(p * 6.0 + vec3(5.0, 2.0, 1.0)) * 0.5
                       + fbmRidge3(p * 13.0 + vec3(2.0, 0.0, 4.0)) * 0.5;
        float mountains  = (terrain - 0.5) * land;
        float oceanFloor = (fbm3(p * 3.0) - 0.5) * (1.0 - land);
        return mountains * 0.036 + oceanFloor * 0.006;
      }
      ${heroDisplaceMain}
    `;
    const earthMat = heroMaterial(earthVS, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthLandCalc}
        vec3 ocean = mix(vec3(0.02, 0.10, 0.32), vec3(0.04, 0.30, 0.58), fbm3(vP * 6.0) * 0.5 + 0.5);
        float biome = fbm3(vP * 1.3 + vec3(7.0, 3.0, 1.0));
        vec3 forestCol = vec3(0.13, 0.30, 0.11);
        vec3 desertCol = vec3(0.62, 0.48, 0.26);
        vec3 groundMix = mix(forestCol, desertCol, smoothstep(0.34, 0.66, biome));
        vec3 groundFine = mix(vec3(0.85, 0.80, 1.0), vec3(1.15, 1.05, 0.85), fbm3(vP * 6.5) * 0.5 + 0.5);
        float ridgeDetail = fbmRidge3(vP * 22.0) - 0.5;
        vec3 ground = groundMix * groundFine * (0.92 + ridgeDetail * 0.20);
        vec3 surf = mix(ocean, ground, land);
        float polar = smoothstep(0.74, 0.94, abs(vP.y));
        surf = mix(surf, vec3(0.90, 0.93, 0.97), polar);
        ${earthCloudCalc}
        surf *= 1.0 - cloud * 0.22;
        /* Ocean specular is broad and soft; ice/snow specular is
           tighter and brighter — real materials, not one fresnel */
        float specPower = mix(40.0, 140.0, polar);
        float specGain  = mix(0.5, 0.9, polar);
        float spec = pow(max(dot(reflect(-L, N), V), 0.0), specPower) * mix(1.0 - land, 1.0, polar) * specGain;
        /* Harsh terminator — near-black night side but for city lights */
        vec3 lit = surf * (0.032 + lambert * 1.10) + vec3(1.0) * spec;
        float night = 1.0 - smoothstep(0.0, 0.16, lambert);
        vec3 cell = floor(vP * 60.0);
        float city = step(0.978, h3(cell)) * step(0.5, land) * night;
        float twinkle = 0.6 + 0.4 * sin(uTime * 3.0 + h3(cell) * 30.0);
        lit += vec3(1.0, 0.85, 0.5) * city * twinkle * 0.9;
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.6);
        lit += vec3(0.25, 0.48, 1.0) * fr * 0.38;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.013) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);
    const cloudMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthCloudCalc}
        gl_FragColor = vec4(vec3(1.0), cloud * (0.35 + lambert * 0.5) * uFade);
      }
    `, THREE.NormalBlending);

    /* ── Gas giants: Jupiter, Saturn, Uranus, Neptune ──
       Each gets its OWN atmosphere-rim color (matching its real
       composition) instead of one generic white-blue glow, a lower
       ambient floor for a harder terminator, and ridged (not just
       smooth-fbm) turbulence in the bands for sharper storm edges  */
    function gasGiantMat(colorExpr, rimCol) {
      return heroMaterial(heroVS_plain, /* glsl */ `
        varying vec3 vN, vWP, vP;
        uniform float uTime, uFade;
        ${COMMON}
        void main() {
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vWP);
          vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
          float lambert = max(dot(N, L), 0.0);
          ${colorExpr}
          /* Limb darkening: the edge of a gas giant reads darker in
             real photography — this alone kills the "flat disc" look */
          float limb = pow(max(dot(N, V), 0.0), 0.45);
          col *= mix(0.45, 1.0, limb);
          vec3 lit = col * (0.055 + lambert * 1.05);
          float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
          lit += ${rimCol} * fr * 0.22;
          /* Phase-dependent atmospheric glow: backlit crescent
             brightens at the rim, like real spacecraft photography */
          float phaseAngle = dot(L, V);
          float backlit = smoothstep(0.0, -0.6, phaseAngle);
          lit += col * backlit * fr * 0.4;
          lit += (grain(gl_FragCoord.xy, uTime) * 0.011) * (0.3 + lambert);
          gl_FragColor = vec4(lit, uFade);
        }
      `, THREE.NormalBlending);
    }
    const jupiterMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.6 + vec3(5.0, 2.0, 0.0)) - 0.5) * 0.6
                 + (fbmRidge3(vP * 4.0 + vec3(1.0, 0.0, 0.0)) - 0.5) * 0.35;
      float bv = lat * 5.0 + warp;
      float b1 = sin(bv); float b2 = sin(bv * 2.3 + 1.0);
      vec3 col = mix(vec3(0.76, 0.60, 0.42), vec3(0.94, 0.84, 0.66), smoothstep(-0.3, 0.3, b1));
      col = mix(col, vec3(0.58, 0.40, 0.26), smoothstep(0.4, 0.7, b2) * 0.5);
      /* Great Red Spot: a real 3-D swirling ellipse, not a round blob —
         its own local tangent frame, an inner rotating warp, and a
         slightly brighter ring right at its edge                    */
      vec3 nP = normalize(vP);
      vec3 grsCenter = normalize(vec3(0.3, -0.18, 0.94));
      float grsU = dot(nP - grsCenter, normalize(vec3(-0.94, 0.0, 0.3)));
      float grsV = dot(nP - grsCenter, vec3(0.0, 1.0, 0.0));
      float grsDist = sqrt(grsU * grsU * 2.5 + grsV * grsV * 0.7) / 0.28;
      float grsMask = smoothstep(1.0, 0.0, grsDist);
      float grsWarp = fbm3(nP * 12.0 + vec3(uTime * 0.02, 0.0, 0.0)) - 0.5;
      float grsRing = exp(-pow((grsDist - 0.65) * 5.0, 2.0));
      vec3 grsCol = mix(vec3(0.72, 0.28, 0.18), vec3(0.88, 0.48, 0.30), grsWarp + 0.5);
      col = mix(col, grsCol, grsMask * 0.85);
      col = mix(col, vec3(0.82, 0.52, 0.38), grsRing * 0.35);
    `, 'vec3(0.88, 0.78, 0.60)');
    const saturnMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.4 + vec3(3.0, 1.0, 0.0)) - 0.5) * 0.4
                 + (fbmRidge3(vP * 3.5) - 0.5) * 0.25;
      float bv = lat * 6.0 + warp;
      vec3 col = mix(vec3(0.80, 0.72, 0.52), vec3(0.94, 0.88, 0.70), smoothstep(-0.4, 0.4, sin(bv)));
      col = mix(col, vec3(0.70, 0.60, 0.42), smoothstep(0.5, 0.8, sin(bv * 1.7)) * 0.3);
    `, 'vec3(0.92, 0.86, 0.66)');
    const uranusMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float bv = lat * 3.0 + (fbm3(vP * 1.2) - 0.5) * 0.15;
      vec3 col = mix(vec3(0.48, 0.82, 0.85), vec3(0.58, 0.90, 0.91), smoothstep(-0.6, 0.6, sin(bv)));
    `, 'vec3(0.68, 0.90, 0.90)');
    const neptuneMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.5 + vec3(2.0, 4.0, 0.0)) - 0.5) * 0.4
                 + (fbmRidge3(vP * 3.8 + vec3(0.0, 2.0, 0.0)) - 0.5) * 0.25;
      float bv = lat * 5.0 + warp;
      vec3 col = mix(vec3(0.06, 0.28, 0.74), vec3(0.16, 0.42, 0.88), smoothstep(-0.4, 0.4, sin(bv)));
      vec3 spotCenter = normalize(vec3(-0.2, 0.3, 0.92));
      float spotD = length(normalize(vP) - spotCenter) / 0.20;
      float spot = smoothstep(1.0, 0.0, spotD);
      col = mix(col, vec3(0.05, 0.16, 0.44), spot * 0.35);
    `, 'vec3(0.35, 0.55, 0.95)');

    function makeRing(innerR, outerR, baseCol, opac) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.NormalBlending,
        uniforms: {
          uInner: { value: innerR }, uOuter: { value: outerR }, uFade: { value: 0 },
          uCol: { value: new THREE.Vector3(...baseCol) }, uOpac: { value: opac },
        },
        vertexShader: /* glsl */ `
          varying vec3 vP;
          void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */ `
          varying vec3 vP;
          uniform float uInner, uOuter, uFade, uOpac;
          uniform vec3 uCol;
          ${COMMON}
          void main() {
            float r = length(vP.xy);
            float rNorm = clamp((r - uInner) / (uOuter - uInner), 0.0, 1.0);

            /* Cassini Division: a real dark gap carved into the ring */
            float cassini = smoothstep(0.44, 0.47, rNorm) * (1.0 - smoothstep(0.47, 0.50, rNorm));

            /* Many narrow bands, layered fbm — not one flat gradient */
            float bandsN = fbm(vec2(rNorm * 28.0, 0.0)) * 0.5 + 0.5;
            float detail  = fbm(vec2(rNorm * 82.0, 0.3)) * 0.25 + 0.75;
            float radial  = bandsN * detail;

            /* Anisotropic (Mie-style) scatter: ice particles backscatter
               toward the Sun — the ring's true world-facing normal is
               its local +Z axis (RingGeometry lies flat in XY), rotated
               into world space so this reacts correctly to the tilt   */
            vec3 ringNormalWorld = normalize(normalMatrix * vec3(0.0, 0.0, 1.0));
            vec3 V = normalize(cameraPosition - (modelMatrix * vec4(vP, 1.0)).xyz);
            float scatter = pow(max(dot(ringNormalWorld, V), 0.0), 0.3);

            vec3 col = mix(uCol * 0.55, uCol * 1.4, radial);
            col += uCol * 0.6 * (1.0 - scatter) * radial;

            float edge = smoothstep(0.0, 0.03, rNorm) * smoothstep(1.0, 0.95, rNorm);
            float alpha = edge * (0.25 + radial * 0.55) * (1.0 - cassini * 0.88) * uOpac * uFade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
      });
      return new THREE.Mesh(new THREE.RingGeometry(innerR, outerR, 96), mat);
    }

    /* ── Volumetric atmosphere shell (rocky bodies + Earth only —
       gas giants get their own limb-darkening/backlit treatment
       baked straight into gasGiantMat instead) ── */
    function makeAtmosphere(radius, atmCol, thin) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: {
          uFade: { value: 0 },
          uAtmCol: { value: new THREE.Vector3(...atmCol) },
          uThin: { value: thin == null ? 1.0 : thin },
        },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform vec3 uAtmCol;
          uniform float uFade, uThin;
          void main() {
            vec3 V = normalize(cameraPosition - vWP);
            vec3 N = normalize(-vN); /* BackSide: normal points inward */
            float fr = pow(1.0 - max(dot(N, V), 0.0), 3.5) * uThin;
            vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
            float sunlit = max(dot(-N, L), 0.0);
            vec3 scatter = uAtmCol * (fr * (0.15 + sunlit * 0.85));
            float limbSun = max(dot(reflect(V, N), L), 0.0);
            scatter += uAtmCol * pow(limbSun, 6.0) * fr * 0.5;
            gl_FragColor = vec4(scatter, clamp(fr * 1.2, 0.0, 1.0) * uFade);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 64, 64), mat);
    }

    /* ── Simulated bloom: a soft additive glow shell behind each body —
       no post-processing pipeline needed for a convincing halo ── */
    function makeGlowHalo(radius, glowCol, opac) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: { uFade: { value: 0 }, uGlowCol: { value: new THREE.Vector3(...glowCol) }, uOpac: { value: opac } },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform vec3 uGlowCol;
          uniform float uFade, uOpac;
          void main() {
            vec3 V = normalize(cameraPosition - vWP);
            float fr = pow(1.0 - max(dot(normalize(-vN), V), 0.0), 4.0);
            gl_FragColor = vec4(uGlowCol, fr * uOpac * uFade);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), mat);
    }

    /* ── Assemble the 8 hero bodies ──
       [name, radius, mat, extra] */
    const HERO_R = {
      Mercury: 0.34, Venus: 0.46, Earth: 0.48, Mars: 0.40,
      Jupiter: 0.62, Saturn: 0.56, Uranus: 0.50, Neptune: 0.48,
    };
    const heroDefs = [
      ['Mercury', mercuryMat, { glow: null } ],
      ['Venus',   venusMat,   { atmo: { col: [1.0, 0.65, 0.2] }, glow: [1.0, 0.7, 0.3] }],
      ['Earth',   earthMat,   { cloud: true, atmo: { col: [0.18, 0.42, 1.0] }, glow: [0.2, 0.5, 1.0] }],
      ['Mars',    marsMat,    { atmo: { col: [0.75, 0.38, 0.18], thin: 0.4 }, glow: [0.8, 0.4, 0.2] }],
      ['Jupiter', jupiterMat, { glow: [0.85, 0.72, 0.55] }],
      ['Saturn',  saturnMat,  { ring: { inner: 1.5, outer: 2.6, color: [0.86, 0.80, 0.60], opac: 0.92, tilt: Math.PI / 2.6 }, glow: [0.90, 0.84, 0.62] }],
      ['Uranus',  uranusMat,  { ring: { inner: 1.55, outer: 1.82, color: [0.74, 0.88, 0.90], opac: 0.45, tilt: 1.45 }, glow: [0.5, 0.85, 0.88] }],
      ['Neptune', neptuneMat, { glow: [0.2, 0.4, 0.9] }],
    ];
    const N = heroDefs.length;
    const heroStages = [];
    const ringMats = [];
    const atmoMats = [];
    const glowMats = [];

    heroDefs.forEach(([name, mat, extra]) => {
      const r = HERO_R[name];
      const group = new THREE.Group();
      const segs = r > 0.5 ? 96 : 80;
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, segs, segs), mat);
      group.add(mesh);
      const mats = [mat];
      if (extra && extra.cloud) {
        group.add(new THREE.Mesh(new THREE.SphereGeometry(r * 1.03, 64, 64), cloudMat));
        mats.push(cloudMat);
      }
      if (extra && extra.ring) {
        const rc = extra.ring;
        const ring = makeRing(r * rc.inner, r * rc.outer, rc.color, rc.opac);
        ring.rotation.x = rc.tilt;
        group.add(ring);
        mats.push(ring.material);
        ringMats.push(ring.material);
      }
      if (extra && extra.atmo) {
        const atmo = makeAtmosphere(r * 1.08, extra.atmo.col, extra.atmo.thin);
        group.add(atmo);
        mats.push(atmo.material);
        atmoMats.push(atmo.material);
      }
      if (extra && extra.glow) {
        const glow = makeGlowHalo(r * 1.4, extra.glow, 0.12);
        group.add(glow);
        mats.push(glow.material);
        glowMats.push(glow.material);
      }
      heroRoot.add(group);
      heroStages.push({ group, mats });
    });

    /* Each planet approaches from its own angle — a corner of a maze,
       not one straight corridor — resolving to dead-center exactly as
       it becomes fully present */
    const HERO_OFFSETS = [
      { x:  0.00, y:  0.00 },
      { x:  0.55, y: -0.30 },
      { x: -0.45, y:  0.35 },
      { x:  0.30, y:  0.22 },
      { x: -0.30, y: -0.40 },
      { x:  0.50, y:  0.15 },
      { x: -0.55, y: -0.10 },
      { x:  0.20, y: -0.45 },
    ];

    /* ═══════════════════════════════════════════
       STAGE CONTENT + INFO PANEL
    ═══════════════════════════════════════════ */
    const STAGES = [
      {
        title: 'Sao Thủy', sub: 'Mercury · gần Mặt Trời nhất',
        desc: 'Hành tinh nhỏ nhất và gần Mặt Trời nhất, bề mặt phủ đầy hố va chạm như Mặt Trăng.',
        facts: [
          'Khoảng cách tới Mặt Trời: ~58 triệu km',
          'Gần như không có khí quyển',
          'Chênh lệch nhiệt độ ngày/đêm cực lớn: -180°C tới 430°C',
          'Một năm chỉ dài 88 ngày Trái Đất',
        ],
      },
      {
        title: 'Sao Kim', sub: 'Venus · hành tinh nóng nhất',
        desc: 'Bị bao phủ bởi mây axit sulfuric dày đặc, gây hiệu ứng nhà kính cực đoan.',
        facts: [
          'Nhiệt độ bề mặt: khoảng 465°C',
          'Một ngày trên Sao Kim dài hơn một năm của nó',
          'Khí quyển chủ yếu là CO2, áp suất gấp ~92 lần Trái Đất',
          'Quay ngược chiều so với hầu hết các hành tinh khác',
        ],
      },
      {
        title: 'Trái Đất', sub: 'Earth · hành tinh xanh',
        desc: 'Hành tinh duy nhất được biết đến có sự sống, với bề mặt phần lớn là đại dương.',
        facts: [
          'Khoảng cách tới Mặt Trời: ~150 triệu km',
          'Đường kính: 12.742 km',
          '71% bề mặt được bao phủ bởi nước',
          'Tự quay: 24 giờ · quỹ đạo: 365,25 ngày',
        ],
      },
      {
        title: 'Sao Hỏa', sub: 'Mars · hành tinh đỏ',
        desc: 'Bề mặt phủ oxit sắt tạo màu đỏ đặc trưng, là đích đến hàng đầu cho thám hiểm con người.',
        facts: [
          'Có núi lửa lớn nhất hệ Mặt Trời: Olympus Mons (~21 km)',
          'Hai mặt trăng nhỏ: Phobos và Deimos',
          'Một ngày dài khoảng 24,6 giờ — gần bằng Trái Đất',
          'Từng có nước lỏng chảy trên bề mặt',
        ],
      },
      {
        title: 'Sao Mộc', sub: 'Jupiter · hành tinh khí khổng lồ',
        desc: 'Hành tinh lớn nhất hệ Mặt Trời, với Vết Đỏ Lớn là một cơn bão khổng lồ đã tồn tại hàng trăm năm.',
        facts: [
          'Đường kính: 139.820 km — gấp 11 lần Trái Đất',
          'Có ít nhất 95 mặt trăng đã biết',
          'Một ngày chỉ dài khoảng 10 giờ — quay nhanh nhất hệ Mặt Trời',
          'Khối lượng lớn hơn tổng các hành tinh còn lại cộng lại',
        ],
      },
      {
        title: 'Sao Thổ', sub: 'Saturn · chúa tể của những chiếc vành đai',
        desc: 'Nổi tiếng với hệ vành đai băng đá và bụi ngoạn mục, trải rộng hàng trăm nghìn km.',
        facts: [
          'Vành đai chủ yếu là băng nước và đá',
          'Có mật độ thấp hơn nước — về lý thuyết có thể nổi',
          'Hơn 140 mặt trăng đã được xác nhận',
          'Gió trong khí quyển có thể đạt 1.800 km/h',
        ],
      },
      {
        title: 'Sao Thiên Vương', sub: 'Uranus · hành tinh nằm nghiêng',
        desc: 'Một hành tinh băng khổng lồ quay gần như nằm ngang so với mặt phẳng quỹ đạo.',
        facts: [
          'Trục quay nghiêng khoảng 98°',
          'Màu xanh lam nhạt do khí metan trong khí quyển',
          'Có hệ vành đai mờ, khó quan sát',
          'Nhiệt độ khí quyển lạnh nhất trong hệ Mặt Trời',
        ],
      },
      {
        title: 'Sao Hải Vương', sub: 'Neptune · hành tinh xa nhất',
        desc: 'Hành tinh xa Mặt Trời nhất, nổi bật với những cơn gió mạnh nhất được ghi nhận.',
        facts: [
          'Khoảng cách tới Mặt Trời: ~4,5 tỷ km',
          'Gió có thể đạt tốc độ hơn 2.100 km/h',
          'Một năm Sao Hải Vương bằng ~165 năm Trái Đất',
          'Từng có "Vết Tối Lớn" — một cơn bão khổng lồ tương tự Sao Mộc',
        ],
      },
    ];

    const ACCENTS = [
      [190, 180, 170], [230, 205, 140], [110, 170, 255], [230, 120, 80],
      [220, 170, 110], [225, 205, 150], [140, 220, 220], [90, 120, 220],
    ];

    const ipCur = document.getElementById('ipCur');
    const ipTitle = document.getElementById('ipTitle');
    const ipSub = document.getElementById('ipSub');
    const ipDesc = document.getElementById('ipDesc');
    const ipFacts = document.getElementById('ipFacts');
    const ipTrackFill = document.getElementById('ipTrackFill');
    const infoPanel = document.getElementById('infoPanel');
    const dots = document.querySelectorAll('#infoPanel .dot');
    const navPrev = document.getElementById('navPrev');
    const navNext = document.getElementById('navNext');
    let ipLiEls = [];

    function renderPanelContent(i) {
      const s = STAGES[i];
      ipCur.textContent = i + 1;
      ipTitle.textContent = s.title;
      ipSub.textContent = s.sub;
      ipDesc.textContent = s.desc;
      ipFacts.innerHTML = '';
      ipLiEls = s.facts.map(f => {
        const li = document.createElement('li');
        li.textContent = f;
        ipFacts.appendChild(li);
        return li;
      });
      dots.forEach((d, di) => d.classList.toggle('active', di === i));
    }

    function applyPanelClarity(ic, accFloor, accNext) {
      const blur = (1 - ic) * 9;
      const op = 0.16 + 0.84 * ic;
      infoPanel.style.opacity = op.toFixed(3);
      infoPanel.style.filter = `blur(${blur.toFixed(2)}px)`;
      infoPanel.style.transform = `translateY(-50%) scale(${(0.95 + 0.05 * ic).toFixed(3)})`;
      const r = accFloor[0] + (accNext[0] - accFloor[0]) * ic;
      const g = accFloor[1] + (accNext[1] - accFloor[1]) * ic;
      const b = accFloor[2] + (accNext[2] - accFloor[2]) * ic;
      infoPanel.style.setProperty('--accent', `${r | 0}, ${g | 0}, ${b | 0}`);
      ipTrackFill.style.width = (ic * 100) + '%';
      const n = ipLiEls.length || 1;
      ipLiEls.forEach((li, idx) => {
        const startAt = (idx / n) * 0.75;
        const local = Math.max(0, Math.min(1, (ic - startAt) / (1 - startAt)));
        li.style.opacity = local.toFixed(3);
        li.style.transform = `translateY(${((1 - local) * 8).toFixed(2)}px)`;
      });
    }
    let lastUpcoming = -1;

    /* ═══════════════════════════════════════════
       INTERACTION
    ═══════════════════════════════════════════ */
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let rotVel = { x: 0, y: 0 };
    let outerRot = { x: 0, y: 0 };

    window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (isDragging) {
        rotVel.y += (e.clientX - prevMouse.x) * 0.006;
        rotVel.x += (e.clientY - prevMouse.y) * 0.006;
        prevMouse = { x: e.clientX, y: e.clientY };
      }
    });

    const SEGMENT_VH = 320;
    let vpH = window.innerHeight;
    let vpWLast = window.innerWidth;
    function segmentPx() { return vpH * SEGMENT_VH / 100; }
    function getMaxScroll() { return Math.max(1, document.documentElement.scrollHeight - vpH); }

    function scrollToWorld(i) {
      const idx = ((i % N) + N) % N;
      window.scrollTo({ top: idx * segmentPx() + 3, behavior: 'smooth' });
    }
    navPrev.addEventListener('click', () => scrollToWorld(floorWorld - 1));
    navNext.addEventListener('click', () => scrollToWorld(floorWorld + 1));
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); scrollToWorld(floorWorld + 1); }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); scrollToWorld(floorWorld - 1); }
    });

    let lastTouch = null, lastPinch = null;
    window.addEventListener('touchmove', e => {
      if (e.touches.length === 2) {
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        if (lastPinch) { rotVel.y += (mx - lastPinch.x) * 0.006; rotVel.x += (my - lastPinch.y) * 0.006; }
        lastPinch = { x: mx, y: my };
      } else {
        lastPinch = null;
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { lastPinch = null; });

    window.addEventListener('resize', () => {
      camera.aspect = W() / H();
      camera.fov = restFov();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
      const w = window.innerWidth, h = window.innerHeight;
      if (w !== vpWLast || Math.abs(h - vpH) > 120) { vpH = h; }
      vpWLast = w;
    });

    /* ═══════════════════════════════════════════
       AMBIENT SOUND (synthesised, opt-in)
    ═══════════════════════════════════════════ */
    let audioCtx = null;
    function initAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -8; limiter.knee.value = 18; limiter.ratio.value = 12;
      limiter.attack.value = 0.003; limiter.release.value = 0.25;
      master.connect(limiter); limiter.connect(ctx.destination);
      master.gain.value = 0;
      master.gain.setTargetAtTime(0.32, ctx.currentTime, 2.0);
      [[42,'sine',0.42],[42.85,'sine',0.17],[84.3,'sine',0.12],[126,'triangle',0.055],[210,'triangle',0.03]].forEach(([f,t,g]) => {
        const o = ctx.createOscillator(), gn = ctx.createGain();
        o.type = t; o.frequency.value = f; gn.gain.value = g;
        o.connect(gn); gn.connect(master); o.start();
      });
      const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns = ctx.createBufferSource(); ns.buffer = buf; ns.loop = true;
      const filt = ctx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 195; filt.Q.value = 3.5;
      const ng = ctx.createGain(); ng.gain.value = 0.036;
      ns.connect(filt); filt.connect(ng); ng.connect(master); ns.start();
      const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.055;
      const lg = ctx.createGain(); lg.gain.value = 75;
      lfo.connect(lg); lg.connect(filt.frequency); lfo.start();
      [528, 531.5, 524.8, 792, 1056].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.value = i < 3 ? 0.0085 : 0.004;
        o.connect(g); g.connect(master); o.start();
      });
      return ctx;
    }
    const sndBtn = document.getElementById('sndBtn');
    sndBtn.addEventListener('click', () => {
      if (!audioCtx) { audioCtx = initAudio(); sndBtn.textContent = '♪ sound on'; sndBtn.classList.add('on'); }
      else if (audioCtx.state === 'suspended') { audioCtx.resume(); sndBtn.classList.add('on'); }
    });

    /* ═══════════════════════════════════════════
       RENDER LOOP
    ═══════════════════════════════════════════ */
    const clock = new THREE.Clock();
    const timedMats = [
      bgMat, mercuryMat, marsMat, venusMat, earthMat, cloudMat,
      jupiterMat, saturnMat, uranusMat, neptuneMat, ...ringMats,
      sunBodyMat,
    ];
    /* JS-side smoothstep — used for the Sun's fade so the shaders
       just receive a plain float uniform, no edge-order ambiguity */
    function smoothstepJS(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    let smoothScrollY = window.scrollY;
    let floorWorld = 0;
    let prevWp = 0;
    let wp = 0;
    let camZ = 3.3;
    let camFov = restFov();
    let lastFrameMs = performance.now();
    const MIN_SECONDS_PER_WORLD = 5;

    (function loop() {
      requestAnimationFrame(loop);
      const t = clock.getElapsedTime();
      const nowMs = performance.now();
      const dt = Math.min(0.1, (nowMs - lastFrameMs) / 1000);
      lastFrameMs = nowMs;

      cosmicGroup.rotation.y += 0.00022;
      cosmicGroup.rotation.x += 0.000095;

      asteroidPivots.forEach(({ pivot, spd, mesh }) => {
        pivot.rotation.y += spd * 0.016;
        mesh.rotation.x += mesh.userData.rx;
        mesh.rotation.z += mesh.userData.rz;
      });

      /* Infinite loop: silently wrap the real scroll position back
         near the top once it hits the very bottom (forward-only) */
      let justWrapped = false;
      {
        const max = getMaxScroll();
        const y = window.scrollY;
        if (y > max - 4) {
          const carry = y - (max - 4);
          window.scrollTo(0, 4 + carry);
          smoothScrollY = 4 + carry;
          justWrapped = true;
        }
      }

      smoothScrollY += (window.scrollY - smoothScrollY) * 0.075;
      const rawWp = Math.max(0, Math.min(N - 0.0001, smoothScrollY / segmentPx()));

      if (justWrapped) {
        wp = rawWp;
      } else {
        const maxStep = dt / MIN_SECONDS_PER_WORLD;
        const diff = rawWp - wp;
        wp = Math.abs(diff) > maxStep ? wp + Math.sign(diff) * maxStep : rawWp;
      }

      const floorP = Math.floor(wp);
      const fracP = wp - floorP;
      const nextIndex = (floorP + 1) % N;
      floorWorld = floorP;

      let scrollDelta = wp - prevWp;
      if (justWrapped) scrollDelta = 0;
      prevWp = wp;

      const growEase = fracP * fracP * (3.0 - 2.0 * fracP);
      const infoRaw = Math.min(1, fracP / 0.82);
      const ic = infoRaw * infoRaw * (3.0 - 2.0 * infoRaw);

      if (nextIndex !== lastUpcoming) {
        lastUpcoming = nextIndex;
        renderPanelContent(nextIndex);
      }
      applyPanelClarity(ic, ACCENTS[floorP], ACCENTS[nextIndex]);

      const presence = new Array(N).fill(0);
      presence[floorP] = 1 - growEase;
      presence[nextIndex] = Math.max(presence[nextIndex] || 0, growEase);

      outerRot.y += rotVel.y + 0.0022 + scrollDelta * 0.9;
      outerRot.x += rotVel.x;
      outerRot.x = Math.max(-0.9, Math.min(0.9, outerRot.x));
      rotVel.x *= 0.93;
      rotVel.y *= 0.93;
      heroRoot.rotation.y = 0.18 + outerRot.y;
      heroRoot.rotation.x = -0.30 + outerRot.x;

      heroStages.forEach((s, i) => {
        const pres = presence[i];
        const off = HERO_OFFSETS[i];
        const away = 1 - pres;
        s.group.visible = pres > 0.003;
        s.group.position.set(off.x * away, off.y * away, -away * 1.7);
        s.group.rotation.z = (i === floorP ? 1 : -1) * away * 0.16;
        s.group.scale.setScalar(0.10 + 1.45 * pres);
        s.group.rotation.y += 0.0016;
        s.mats.forEach(m => { if (m.uniforms.uFade) m.uniforms.uFade.value = pres; });
      });

      bgMat.uniforms.uWorldT.value = wp;

      /* Sun: bright and prominent right as the loop restarts at
         Mercury, fading into the depths as the journey moves on —
         then returning every time the loop wraps back around      */
      const sunFade = smoothstepJS(2.0, 0.0, wp);
      sunBodyMat.uniforms.uSunFade.value = sunFade;
      coronaShells.forEach(s => { s.material.uniforms.uFade.value = sunFade; });
      sunFlares.forEach(({ pts, mat, i }) => {
        pts.position.set(
          SUN_POS.x + Math.sin(t * 0.3 + i * Math.PI / 2) * 1.25,
          SUN_POS.y + Math.cos(t * 0.2 + i * Math.PI / 2) * 1.25,
          SUN_POS.z
        );
        mat.opacity = (0.5 + 0.5 * Math.sin(t + i)) * sunFade;
      });

      timedMats.forEach(m => { if (m.uniforms?.uTime) m.uniforms.uTime.value = t; });

      metData.forEach((m, mi) => {
        const cy = (t + m.phase) % m.period;
        const active = cy < ACTIVE_DUR;
        const b6 = mi * 6, b3 = mi * 3;
        if (active) {
          const prog = cy / ACTIVE_DUR;
          const hd = prog * m.speed * ACTIVE_DUR;
          const td = Math.max(0, hd - m.trail);
          const fadeIn = Math.min(1.0, prog / 0.09);
          const fadeOut = 1.0 - Math.pow(Math.max(0.0, (prog - 0.72) / 0.28), 1.6);
          const fade = fadeIn * fadeOut * m.bright;
          tailPos[b6] = m.sx + m.dx * hd; tailPos[b6+1] = m.sy + m.dy * hd; tailPos[b6+2] = m.sz + m.dz * hd;
          tailPos[b6+3] = m.sx + m.dx * td; tailPos[b6+4] = m.sy + m.dy * td; tailPos[b6+5] = m.sz + m.dz * td;
          tailCol[b6] = m.col[0]*fade; tailCol[b6+1] = m.col[1]*fade; tailCol[b6+2] = m.col[2]*fade;
          tailCol[b6+3] = 0; tailCol[b6+4] = 0; tailCol[b6+5] = 0;
          headPos[b3] = tailPos[b6]; headPos[b3+1] = tailPos[b6+1]; headPos[b3+2] = tailPos[b6+2];
          headCol[b3] = m.col[0]*fade*3.5; headCol[b3+1] = m.col[1]*fade*3.5; headCol[b3+2] = m.col[2]*fade*3.5;
        } else {
          for (let k = 0; k < 6; k++) { tailPos[b6+k] = 0; tailCol[b6+k] = 0; }
          headPos[b3] = 0; headPos[b3+1] = -999; headPos[b3+2] = 0;
          headCol[b3] = 0; headCol[b3+1] = 0; headCol[b3+2] = 0;
        }
      });
      tailGeo.attributes.position.needsUpdate = true;
      tailGeo.attributes.color.needsUpdate = true;
      headGeo.attributes.position.needsUpdate = true;
      headGeo.attributes.color.needsUpdate = true;

      const dive = growEase;
      const targetZ = 3.3 - dive * 0.75;
      const targetFov = restFov() - dive * 4;
      camZ += (targetZ - camZ) * 0.10;
      camFov += (targetFov - camFov) * 0.10;
      camera.position.z = camZ + Math.sin(t * 0.15) * 0.05;
      if (Math.abs(camera.fov - camFov) > 0.01) { camera.fov = camFov; camera.updateProjectionMatrix(); }

      renderer.render(scene, camera);
    })();

  })(); /* end IIFE */
  </script>
