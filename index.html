  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crystal Solar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Space+Grotesk:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════
       DESIGN TOKENS — 70% igloo.inc cool-gray minimal UI,
       30% space (Vietnamese planet facts + WebGL journey)
    ═══════════════════════════════════════════════════ */
    :root {
      --bg:       #0b0d12;   /* cool charcoal-black — NOT warm purple */
      --surface:  #10131a;
      --surface2: #181c26;
      --gray-lo:  #b6bac5;
      --gray-mid: #7c8494;
      --gray-hi:  #383e4e;
      --accent:   #b6bac5;   /* updated per-frame by JS to the current planet's accent */
      --font-display: 'Cinzel', serif;
      --font-ui:      'Space Grotesk', sans-serif;
      --font-mono:    'DM Mono', monospace;
    }
    /* ═══════════════════════════════════════════════════
       BASE STYLES
    ═══════════════════════════════════════════════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      width: 100vw;
      overflow-x: hidden;
      font-family: var(--font-ui);
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }
    #flareCanvas {
      z-index: 8;
      pointer-events: none;
    }
    /* Real scrollable height — one tall invisible column.
       The canvas + UI stay fixed; scrolling through this is
       what drives the journey through each planet.         */
    #scrollSpacer {
      position: relative;
      width: 100%;
      height: 2560vh;   /* 8 planets × 320vh of travel each */
      height: 2560dvh;  /* dynamic viewport height — stays in sync with
                            window.innerHeight as mobile browser chrome
                            shows/hides, instead of drifting out of sync
                            with the static `vh` unit while scrolling  */
      pointer-events: none;
    }

    /* ── Hint text ── */
    .hint {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .10em;
      color: var(--gray-mid);
      opacity: .35;
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Sound toggle: plain monospace text, no box ── */
    #sndBtn {
      position: fixed;
      top: calc(22px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gray-mid);
      cursor: pointer;
      user-select: none;
      border: none;
      background: none;
      padding: 0;
      transition: color .3s;
      z-index: 20;
    }
    @media (max-width: 640px), (pointer: coarse) {
      #sndBtn { font-size: 12px; padding: 8px; }
    }
    #sndBtn:hover { color: var(--gray-lo); }
    #sndBtn.on   { color: var(--accent); }

    /* ── Narration language toggle — same plain-text style, just below ── */
    #langBtn {
      position: fixed;
      top: calc(42px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .12em;
      color: var(--gray-mid);
      cursor: pointer;
      user-select: none;
      border: none;
      background: none;
      padding: 0;
      transition: color .3s;
      z-index: 20;
    }
    #langBtn:hover { color: var(--gray-lo); }
    @media (max-width: 640px), (pointer: coarse) {
      #langBtn { top: calc(64px + env(safe-area-inset-top, 0px)); font-size: 11px; padding: 6px 8px; }
    }

    /* ── Detail inset — small close-up render, top-right ── */
    #detailInset {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      width: 168px; height: 108px;
      border: 1px solid var(--gray-hi);
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
      z-index: 14;
      pointer-events: none;
      opacity: .92;
    }
    #detailInset canvas { display: block; width: 100%; height: 100%; }
    #detailLabel {
      position: absolute; bottom: 0; left: 0; right: 0;
      font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--gray-lo);
      background: rgba(11,13,18,.72); padding: 3px 6px;
    }
    @media (max-width: 640px), (pointer: coarse) {
      #detailInset { top: calc(96px + env(safe-area-inset-top, 0px)); width: 128px; height: 84px; }
    }

    /* ── Intro veil (fade-in overlay) ── */
    #veil {
      position: fixed;
      inset: 0;
      background: var(--bg);
      pointer-events: none;
      z-index: 60;
      opacity: 1;
      transition: opacity 2.5s ease-in-out;
    }

    /* ═══════════════════════════════════════════════════
       INFO PANEL — left side, flat/opaque igloo-style card,
       previews whichever planet is being travelled toward
    ═══════════════════════════════════════════════════ */
    #infoPanel {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: min(240px, 28vw);
      max-height: 88vh; /* never clipped off-screen on short/landscape phones */
      overflow-y: auto;
      padding: 28px 24px;
      background: var(--surface);         /* flat, no blur, no gradient */
      border-right: 1px solid var(--gray-hi);
      border-top: 1px solid var(--gray-hi);
      border-bottom: 1px solid var(--gray-hi);
      border-radius: 0 4px 4px 0;
      color: var(--gray-lo);
      z-index: 15;
      pointer-events: none;
    }
    @media (max-width: 900px) and (min-width: 641px) {
      #infoPanel { width: min(210px, 30vw); padding: 22px 18px; }
    }
    #ipTrack {
      height: 2px; width: 100%;
      background: var(--gray-hi);
      overflow: hidden; margin-bottom: 14px;
    }
    #ipTrackFill { height: 100%; width: 0%; background: var(--accent); }
    .ip-label {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--accent); opacity: .7; margin-bottom: 14px;
    }
    .ip-index { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--gray-mid); margin-bottom: 14px; }
    .ip-index .ip-sep { opacity: .5; margin: 0 2px; }
    #ipTitle {
      font-family: var(--font-display); font-weight: 400;
      font-size: clamp(14px, 2.2vw, 20px); letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 4px;
    }
    #ipSub { font-family: var(--font-ui); font-weight: 300; font-size: 10px; letter-spacing: .04em; color: var(--gray-mid); margin-bottom: 20px; }
    #ipFacts { list-style: none; display: flex; flex-direction: column; margin-bottom: 4px; }
    #ipFacts li {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 8px 0; border-bottom: 1px solid rgba(56, 62, 78, .6);
    }
    #ipFacts li .stat-label {
      font-family: var(--font-ui); font-weight: 300; font-size: 10px; letter-spacing: .08em;
      text-transform: uppercase; color: var(--gray-mid);
    }
    #ipFacts li .stat-value { font-family: var(--font-mono); font-weight: 300; font-size: 12px; color: var(--gray-lo); }
    #ipDesc { font-family: var(--font-ui); font-weight: 300; font-size: 11px; line-height: 1.7; color: var(--gray-mid); margin-top: 16px; }
    @media (max-width: 640px) {
      #infoPanel { width: min(210px, 50vw); padding: 16px 14px; }
      #ipTitle { font-size: 14px; }
      #ipDesc  { font-size: 10px; }
      /* Stack label above value instead of side-by-side — the safe layout
         regardless of how long a given fact's value happens to be         */
      #ipFacts li { flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 0; }
    }
    @media (max-width: 360px) {
      #infoPanel { width: min(190px, 54vw); padding: 14px 12px; }
      #ipTitle { font-size: 12.5px; }
      #ipFacts li .stat-label { font-size: 9px; }
      #ipFacts li .stat-value { font-size: 10.5px; }
      #ipDesc { font-size: 9.5px; line-height: 1.55; }
    }

    /* ── Vertical scroll nav — right edge, igloo-style ── */
    #stageNav {
      position: fixed;
      right: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      z-index: 15;
    }
    #ipTrackV { width: 1px; height: 120px; background: var(--gray-hi); position: relative; }
    #ipTrackVFill {
      position: absolute; bottom: 0; left: 0; width: 1px;
      background: var(--gray-lo); height: 0%;
      transition: height .1s linear;
    }
    #stageNav .nav-dots { display: flex; flex-direction: column; gap: 10px; }
    #stageNav button.nav-dot {
      width: 4px; height: 4px; padding: 6px; margin: -6px;
      border-radius: 50%; background: none; border: none; cursor: pointer;
    }
    #stageNav button.nav-dot::before {
      content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
      background: var(--gray-hi); transition: background .3s, transform .3s;
    }
    #stageNav button.nav-dot.active::before { background: var(--gray-lo); transform: scale(1.4); }
  </style>

  <!-- ═══════════════════════════════════════════════════
       VEIL REMOVAL
  ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      function fadeVeil() {
        var v = document.getElementById('veil');
        if (!v) return;
        v.style.opacity = '0';
        setTimeout(function () { if (v.parentNode) v.parentNode.removeChild(v); }, 2800);
      }
      setTimeout(fadeVeil, 400);
    })();

  <!-- Three.js r134 from cdnjs (allowed CDN in artifact sandbox) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- ═══════════════════════════════════════════════════
       MAIN SCENE
  ═══════════════════════════════════════════════════ -->
  <script>
  (function () {
    if (typeof THREE === 'undefined') {
      console.error('[scene] THREE.js failed to load — cannot render scene.');
      return;
    }

    /* ═══════════════════════════════════════════
       RENDERER + CAMERA
    ═══════════════════════════════════════════ */
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2.5));
    renderer.setSize(W(), H());
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = false; /* shadows are hand-rolled in-shader (Saturn's ring shadow) — no JS shadow-map overhead */
    renderer.sortObjects = true;
    renderer.autoClear = false; /* the bloom pipeline below clears explicitly per pass */

    function restFov() {
      const aspect = W() / H();
      return aspect < 0.8 ? 52 : aspect < 1.05 ? 46 : 38;
    }

    /* Cinematic lens flare — drawn on a plain 2-D canvas overlaid on
       the WebGL one, not more 3-D geometry: it's screen-space by
       nature (it lives on the LENS, not in the scene), so Canvas2D
       is the honest tool for it rather than faking it with sprites. */
    const flareCanvas = document.getElementById('flareCanvas');
    const flareCtx = flareCanvas.getContext('2d');
    function resizeFlareCanvas() {
      const dpr = Math.min(devicePixelRatio, 2);
      flareCanvas.width = Math.max(1, Math.round(W() * dpr));
      flareCanvas.height = Math.max(1, Math.round(H() * dpr));
      flareCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeFlareCanvas();

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(restFov(), W() / H(), 0.05, 120);
    camera.position.set(0, 0, 3.3);
    camera.lookAt(0, 0, 0);

    /* ── Detail inset: a second, small renderer + camera sharing the SAME
       scene, parked close beside whichever planet is currently in view —
       a permanent "close-up" window onto the surface detail (craters,
       bands, rings) that's too fine to read from the main dive camera. */
    const detailCanvas = document.getElementById('detailCanvas');
    const detailRenderer = new THREE.WebGLRenderer({ canvas: detailCanvas, antialias: true, alpha: true });
    detailRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const detailCamera = new THREE.PerspectiveCamera(30, 168 / 108, 0.02, 60);
    let detailOrbitT = 0;
    const detailCenter = new THREE.Vector3();
    function resizeDetailRenderer() {
      const el = document.getElementById('detailInset');
      const w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
      detailRenderer.setSize(w, h, false);
      detailCamera.aspect = w / h;
      detailCamera.updateProjectionMatrix();
    }
    resizeDetailRenderer();

    /* ═══════════════════════════════════════════
       POST-PROCESSING — hand-rolled two-pass bloom
       + chromatic aberration. No addon library: just
       WebGLRenderTarget + fullscreen quads, four passes
       per frame:
         1) main scene, full resolution        → rtMain
         2) same scene, camera sees ONLY the
            objects on BLOOM_LAYER (sun, corona,
            flares, meteor heads) at half-res    → rtGlow
         3) separable 9-tap Gaussian blur,
            horizontal then vertical             → rtBlurA → rtBlurB
         4) composite rtMain + rtBlurB*strength,
            with chromatic aberration, straight
            to the screen
       (Only rtGlow/rtBlurA/rtBlurB run at half
       resolution — rtMain stays full-res so the
       actual scene detail this whole project is
       built on on isn't softened by the bloom pass.)
    ═══════════════════════════════════════════ */
    const BLOOM_LAYER = 1;
    function markBloom(obj) { obj.layers.enable(BLOOM_LAYER); }

    const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false };
    let rtMain  = new THREE.WebGLRenderTarget(W(), H(), rtOpts);
    let glowW   = Math.max(2, Math.floor(W() / 2));
    let glowH   = Math.max(2, Math.floor(H() / 2));
    let rtGlow  = new THREE.WebGLRenderTarget(glowW, glowH, rtOpts);
    let rtBlurA = new THREE.WebGLRenderTarget(glowW, glowH, rtOpts);
    let rtBlurB = new THREE.WebGLRenderTarget(glowW, glowH, rtOpts);

    const quadScene = new THREE.Scene();
    const quadCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const quadGeo   = new THREE.PlaneGeometry(2, 2);
    const quadVS = /* glsl */ `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2(1 / glowW, 1 / glowH) } },
      vertexShader: quadVS,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        uniform sampler2D tDiffuse;
        uniform vec2 uDir, uTexel;
        void main() {
          /* 9-tap separable Gaussian: 1 center + 4 symmetric pairs */
          float w0 = 0.227, w1 = 0.194, w2 = 0.121, w3 = 0.054, w4 = 0.016;
          vec2 o = uDir * uTexel;
          vec3 sum = texture2D(tDiffuse, vUv).rgb * w0;
          sum += texture2D(tDiffuse, vUv + o * 1.0).rgb * w1; sum += texture2D(tDiffuse, vUv - o * 1.0).rgb * w1;
          sum += texture2D(tDiffuse, vUv + o * 2.0).rgb * w2; sum += texture2D(tDiffuse, vUv - o * 2.0).rgb * w2;
          sum += texture2D(tDiffuse, vUv + o * 3.0).rgb * w3; sum += texture2D(tDiffuse, vUv - o * 3.0).rgb * w3;
          sum += texture2D(tDiffuse, vUv + o * 4.0).rgb * w4; sum += texture2D(tDiffuse, vUv - o * 4.0).rgb * w4;
          gl_FragColor = vec4(sum, 1.0);
        }
      `,
    });
    const blurQuad = new THREE.Mesh(quadGeo, blurMat);
    quadScene.add(blurQuad);

    const compositeMat = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: null }, tBloom: { value: null },
        uBloomStrength: { value: 0.85 }, uChrAberration: { value: 0.004 },
      },
      vertexShader: quadVS,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        uniform sampler2D tScene, tBloom;
        uniform float uBloomStrength, uChrAberration;
        void main() {
          /* Chromatic aberration: only kicks in away from center,
             so the middle of the frame — where the eye rests — stays
             perfectly sharp                                        */
          vec2 dir = vUv - 0.5;
          float d = length(dir);
          float mask = smoothstep(0.35, 0.65, d);
          float str = d * uChrAberration * mask;

          float r = texture2D(tScene, vUv + dir * str).r;
          float g = texture2D(tScene, vUv).g;
          float b = texture2D(tScene, vUv - dir * str).b;
          vec3 col = vec3(r, g, b);

          float br = texture2D(tBloom, vUv + dir * str * 2.0).r;
          float bg = texture2D(tBloom, vUv).g;
          float bb = texture2D(tBloom, vUv - dir * str * 2.0).b;
          col += vec3(br, bg, bb) * uBloomStrength;

          /* ACES filmic tonemap + gamma — this quad is the one true final
             pixel write, so (unlike renderer.toneMapping, which never runs
             on a custom ShaderMaterial pipeline) this actually takes effect */
          col = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);
          col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));

          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    const compositeQuad = new THREE.Mesh(quadGeo, compositeMat);
    quadScene.add(compositeQuad);

    function runFullscreenPass(mesh, target) {
      blurQuad.visible = (mesh === blurQuad);
      compositeQuad.visible = (mesh === compositeQuad);
      renderer.setRenderTarget(target);
      renderer.clear();
      renderer.render(quadScene, quadCam);
    }

    function renderWithBloom() {
      renderer.setRenderTarget(rtMain);
      renderer.clear();
      renderer.render(scene, camera);

      camera.layers.set(BLOOM_LAYER);
      renderer.setRenderTarget(rtGlow);
      renderer.setClearColor(0x000000, 1);
      renderer.clear();
      renderer.render(scene, camera);
      camera.layers.set(0);

      blurMat.uniforms.tDiffuse.value = rtGlow.texture;
      blurMat.uniforms.uDir.value.set(1, 0);
      runFullscreenPass(blurQuad, rtBlurA);

      blurMat.uniforms.tDiffuse.value = rtBlurA.texture;
      blurMat.uniforms.uDir.value.set(0, 1);
      runFullscreenPass(blurQuad, rtBlurB);

      compositeMat.uniforms.tScene.value = rtMain.texture;
      compositeMat.uniforms.tBloom.value = rtBlurB.texture;
      runFullscreenPass(compositeQuad, null);
    }

    function resizeBloomTargets() {
      rtMain.setSize(W(), H());
      glowW = Math.max(2, Math.floor(W() / 2));
      glowH = Math.max(2, Math.floor(H() / 2));
      rtGlow.setSize(glowW, glowH);
      rtBlurA.setSize(glowW, glowH);
      rtBlurB.setSize(glowW, glowH);
      blurMat.uniforms.uTexel.value.set(1 / glowW, 1 / glowH);
    }

    /* Draws the flare each frame, projecting the Sun's actual world
       position through the camera's own matrices — this is a real
       screen-space projection, not a hand-placed decal, so it tracks
       the Sun correctly through every drag/dive/breath the camera does */
    const _flareWorldPos = new THREE.Vector3();
    function drawLensFlare(sunFade) {
      flareCtx.clearRect(0, 0, W(), H());
      if (sunFade <= 0.002) return;

      camera.updateMatrixWorld(true);
      sunGroup.getWorldPosition(_flareWorldPos);
      _flareWorldPos.project(camera); /* → NDC, using matrixWorldInverse + projectionMatrix */
      if (_flareWorldPos.z > 1 || _flareWorldPos.z < -1) return; /* behind the camera */

      const sx = (_flareWorldPos.x * 0.5 + 0.5) * W();
      const sy = (1 - (_flareWorldPos.y * 0.5 + 0.5)) * H();
      const cx = W() / 2, cy = H() / 2;
      const dx = cx - sx, dy = cy - sy;
      const sunScreenDist = Math.hypot(_flareWorldPos.x, _flareWorldPos.y);
      const overallAlpha = sunFade * (1.0 - Math.min(1, sunScreenDist / 0.8) * 0.3);
      if (overallAlpha <= 0.002) return;

      const pointAt = t => [sx + dx * t, sy + dy * t];
      function hexAt(x, y, rad) {
        flareCtx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
          if (i === 0) flareCtx.moveTo(px, py); else flareCtx.lineTo(px, py);
        }
        flareCtx.closePath();
      }

      flareCtx.globalAlpha = overallAlpha;

      let [x, y] = pointAt(0);
      let g = flareCtx.createRadialGradient(x, y, 0, x, y, 80);
      g.addColorStop(0, 'rgba(255,220,100,0.9)'); g.addColorStop(1, 'rgba(255,220,100,0)');
      flareCtx.fillStyle = g; flareCtx.beginPath(); flareCtx.arc(x, y, 80, 0, Math.PI * 2); flareCtx.fill();

      [x, y] = pointAt(0.25);
      flareCtx.fillStyle = 'rgba(255,180,80,0.25)'; hexAt(x, y, 18); flareCtx.fill();

      [x, y] = pointAt(0.45);
      g = flareCtx.createRadialGradient(x, y, 0, x, y, 35);

        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2(-1.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);

        vec3 L = normalize(vec3(0.8,1.4,2.0));
        col += pow(max(dot(N, normalize(L+V)), 0.0), 28.0) * 0.22;
        col += mix(vec3(0.40,0.07,0.72), vec3(0.06,0.38,0.85), fbm3(vP*1.5)) * fr * 0.58;
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const aOrbits = [
      [1.55,0.85,0.30,0.016,0.5,0.092],[2.08,-0.48,0.72,0.011,2.2,0.120],
      [2.62,0.22,-0.58,0.0075,3.9,0.105],[1.82,1.18,0.15,0.014,1.4,0.072],
      [3.10,-0.28,0.84,0.006,3.6,0.140],[1.68,0.62,-0.42,0.019,0.9,0.082],
      [2.35,-0.88,0.52,0.009,2.8,0.115],[2.80,0.38,1.05,0.008,5.0,0.095],
    ];
    const asteroidPivots = [];
    aOrbits.forEach(([orbitR, tX, tZ, spd, ang, sz], ai) => {
      const mat = new THREE.ShaderMaterial({ side: THREE.FrontSide, uniforms: {}, vertexShader: asteroidVS, fragmentShader: asteroidFS });
      /* Faceted crystal shards, not rounded rocks — an Icosahedron/Octahedron
         base (genuinely flat triangular faces, unlike a subdivided sphere)
         jittered per-vertex, then de-indexed so computeVertexNormals gives
         each triangle its OWN flat normal instead of smoothing across faces —
         this is what actually reads as "crystal" rather than "asteroid".   */
      let geo = ai % 2 === 0 ? new THREE.IcosahedronGeometry(sz, 0) : new THREE.OctahedronGeometry(sz, 0);
      geo = geo.toNonIndexed();
      const pos = geo.attributes.position;
      for (let j = 0; j < pos.count; j++) {
        const x=pos.getX(j), y=pos.getY(j), z=pos.getZ(j);
        const r=Math.sqrt(x*x+y*y+z*z), d=1+(Math.random()-0.5)*0.55;
        pos.setXYZ(j, x/r*r*d, y/r*r*d, z/r*r*d);
      }
      pos.needsUpdate = true; geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = orbitR;
      mesh.userData = { rx: 0.003+Math.random()*0.006, rz: 0.002+Math.random()*0.005 };
      const pivot = new THREE.Group();
      pivot.rotation.x = tX; pivot.rotation.z = tZ; pivot.rotation.y = ang;
      pivot.add(mesh);
      cosmicGroup.add(pivot);
      asteroidPivots.push({ pivot, spd, mesh });
    });

    const N_MET = 10;
    const ACTIVE_DUR = 12.0;
    const metColors = [[1.00,0.96,0.82],[0.62,0.88,1.00],[0.42,1.00,0.92],[1.00,0.52,0.88],[0.80,0.52,1.00],[1.00,0.88,0.42],[0.72,1.00,0.58],[0.90,0.78,1.00]];
    const tailPos = new Float32Array(N_MET*6), tailCol = new Float32Array(N_MET*6);
    const headPos = new Float32Array(N_MET*3), headCol = new Float32Array(N_MET*3);
    const metData = [];
    for (let m = 0; m < N_MET; m++) {
      const ang = Math.random()*Math.PI*2, slope = (Math.random()-0.5)*0.5-0.08;
      let dx=Math.cos(ang), dy=Math.sin(ang)+slope, dz=(Math.random()-0.5)*0.12;
      const dl=Math.sqrt(dx*dx+dy*dy+dz*dz); dx/=dl; dy/=dl; dz/=dl;
      metData.push({
        dx, dy, dz, speed: 0.28+Math.random()*0.60, trail: 5.5+Math.random()*7.5,
        period: 15+Math.random()*22, phase: Math.random()*40,
        sx: -dx*(6+Math.random()*5), sy: -dy*(6+Math.random()*5)+(Math.random()-0.5)*3,
        sz: -1+Math.random()*4, bright: 0.65+Math.random()*0.35, col: metColors[m % metColors.length],
      });
    }
    const tailGeo = new THREE.BufferGeometry();
    tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
    tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
    const meteorLines = new THREE.LineSegments(tailGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    meteorLines.renderOrder = 9;
    cosmicGroup.add(meteorLines);
    const headGeo = new THREE.BufferGeometry();
    headGeo.setAttribute('position', new THREE.BufferAttribute(headPos, 3));
    headGeo.setAttribute('color', new THREE.BufferAttribute(headCol, 3));
    const meteorHeads = new THREE.Points(headGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.20, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, sizeAttenuation: true,
    }));
    meteorHeads.renderOrder = 9;
    markBloom(meteorHeads);
    cosmicGroup.add(meteorHeads);

    /* ── 6 hero bright stars, as REAL 3-D point sprites ──
       Previously these were 6 hand-placed points baked into the flat
       background quad — fixed to the screen, never moving relative
       to it. As actual objects in the scene at radius ~12, they now
       parallax correctly when the camera drags/dives, like every
       other star here already does.                                */
    const HERO_STAR_DIRS = [
      [ 0.35,  0.55, -0.75], [-0.60,  0.30,  0.74], [ 0.70, -0.35, -0.62],
      [-0.30, -0.70,  0.65], [ 0.15,  0.80,  0.58], [-0.75, -0.10, -0.65],
    ];
    const HERO_STAR_COLORS = [
      [0.90, 0.94, 1.0], [0.86, 0.90, 1.0], [0.95, 0.92, 1.0],
      [0.90, 0.88, 1.0], [0.88, 0.93, 1.0], [0.96, 0.95, 1.0],
    ];
    const HERO_STAR_PHASE = [0.8, 2.3, 4.1, 1.5, 3.7, 5.2];
    const heroStarPos = new Float32Array(18);
    const heroStarCol = new Float32Array(18);
    const heroStarPhase = new Float32Array(6);
    HERO_STAR_DIRS.forEach(([x, y, z], i) => {
      const len = Math.sqrt(x * x + y * y + z * z);
      heroStarPos[i * 3]     = (x / len) * 12;
      heroStarPos[i * 3 + 1] = (y / len) * 12;
      heroStarPos[i * 3 + 2] = (z / len) * 12;
      heroStarCol[i * 3] = HERO_STAR_COLORS[i][0];
      heroStarCol[i * 3 + 1] = HERO_STAR_COLORS[i][1];
      heroStarCol[i * 3 + 2] = HERO_STAR_COLORS[i][2];
      heroStarPhase[i] = HERO_STAR_PHASE[i];
    });
    const heroStarGeo = new THREE.BufferGeometry();
    heroStarGeo.setAttribute('position', new THREE.BufferAttribute(heroStarPos, 3));
    heroStarGeo.setAttribute('aColor', new THREE.BufferAttribute(heroStarCol, 3));
    heroStarGeo.setAttribute('aPhase', new THREE.BufferAttribute(heroStarPhase, 1));
    const heroStarMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 } },
      vertexShader: /* glsl */ `
        attribute vec3 aColor;
        attribute float aPhase;
        varying vec3 vColor;
        varying float vPhase;
        void main() {
          vColor = aColor;
          vPhase = aPhase;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = clamp(260.0 / -mv.z, 40.0, 260.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        varying vec3 vColor;
        varying float vPhase;
        void main() {
          vec2 p = gl_PointCoord - 0.5;
          /* 4-arm diffraction spike: horizontal, vertical, both diagonals */
          float spike = exp(-p.x*p.x*800.0) * exp(-p.y*p.y*6000.0)
                      + exp(-p.y*p.y*800.0) * exp(-p.x*p.x*6000.0)
                      + exp(-(p.x+p.y)*(p.x+p.y)*700.0) * exp(-(p.x-p.y)*(p.x-p.y)*5000.0)
                      + exp(-(p.x-p.y)*(p.x-p.y)*700.0) * exp(-(p.x+p.y)*(p.x+p.y)*5000.0);
          float core = exp(-dot(p, p) * 120.0);
          float twinkle = 0.6 + 0.4 * sin(uTime * 0.5 + vPhase);
          float b = (spike + core) * twinkle;
          gl_FragColor = vec4(vColor * b * 2.2, clamp(b, 0.0, 1.0));
        }
      `,
    });
    const heroStars = new THREE.Points(heroStarGeo, heroStarMat);
    markBloom(heroStars);
    cosmicGroup.add(heroStars);

    /* ═══════════════════════════════════════════
       HERO STAGES — 8 planets, one dived into at a
       time. Every solid body displaces its own
       geometry along a noise height field and
       reconstructs the normal by finite differences.
    ═══════════════════════════════════════════ */
    const heroRoot = new THREE.Group();
    heroRoot.rotation.x = -0.30;
    heroRoot.rotation.z = 0.12;
    scene.add(heroRoot);

    const heroVS_plain = /* glsl */ `
      varying vec3 vN, vWP, vP;
      void main() {
        vN = normalize(normalMatrix * normal); vP = position;
        vWP = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const heroDisplaceMain = /* glsl */ `
      void main() {
        vec3 n0 = normalize(position);
        vec3 up = abs(n0.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 t1 = normalize(cross(n0, up));
        vec3 t2 = normalize(cross(n0, t1));
        float eps = 0.01;
        float h0 = heroHeight(position);
        float h1 = heroHeight(position + t1 * eps);
        float h2 = heroHeight(position + t2 * eps);
        vec3 dp0 = position + n0 * h0;
        vec3 dp1 = position + t1 * eps + n0 * h1;
        vec3 dp2 = position + t2 * eps + n0 * h2;
        vec3 faceN = normalize(cross(dp1 - dp0, dp2 - dp0));
        vec3 objN  = normalize(mix(normal, faceN, 0.85));
        vN  = normalize(normalMatrix * objN);
        vP  = position;
        vWP = (modelMatrix * vec4(dp0, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(dp0, 1.0);
      }
    `;
    function heroMaterial(vs, fs, blending) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: blending || THREE.NormalBlending,
        uniforms: { uTime: { value: 0 }, uFade: { value: 0 } },
        vertexShader: vs, fragmentShader: fs,
      });
    }

    /* ═══════════════════════════════════════════
       SUN — the actual light source, always somewhere
       out in the depths. Not a hero stage: it never
       becomes a focused planet, it just recedes/returns
       as uSunFade tracks how far into the journey we are.
    ═══════════════════════════════════════════ */
    const SUN_POS = new THREE.Vector3(0, 0, -18);

    const sunBodyMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uSunFade: { value: 1 } },
      vertexShader: heroVS_plain,
      fragmentShader: /* glsl */ `
        varying vec3 vN, vWP, vP;
        uniform float uTime, uSunFade;
        ${COMMON}
        void main() {
          vec3 col = mix(vec3(1.0, 0.55, 0.05), vec3(1.0, 0.92, 0.45),
                          fbm3(vP * 3.0 + vec3(uTime * 0.04, 0.0, 0.0)));
          col += vec3(1.0, 0.85, 0.4) * cellular3(vP * 8.0).x * 0.12;
          /* It IS the light — no lighting equation, just emission */
          gl_FragColor = vec4(col * 2.2, uSunFade);
        }
      `,
    });
    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), sunBodyMat);

    function makeCoronaShell(radius, innerCol, outerCol, opacFactor) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: { uFade: { value: 1 }, uShellR: { value: radius } },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform float uFade, uShellR;
          void main() {
            float dist = length(vP) / uShellR;
            float fr = pow(max(0.0, 1.0 - dist), 2.5);
            vec3 coronaCol = mix(${innerCol}, ${outerCol}, dist);
            gl_FragColor = vec4(coronaCol, fr * ${opacFactor} * uFade);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
    }
    const coronaShells = [
      makeCoronaShell(1.3, 'vec3(1.0, 0.6, 0.1)', 'vec3(0.8, 0.3, 0.0)', 0.08),
      makeCoronaShell(1.7, 'vec3(1.0, 0.6, 0.1)', 'vec3(0.8, 0.3, 0.0)', 0.08),
      makeCoronaShell(2.4, 'vec3(1.0, 0.4, 0.05)', 'vec3(1.0, 0.4, 0.05)', 0.04),
    ];

    markBloom(sunMesh);
    const sunGroup = new THREE.Group();
    sunGroup.position.copy(SUN_POS);
    sunGroup.add(sunMesh);
    coronaShells.forEach(s => { markBloom(s); sunGroup.add(s); });
    heroRoot.add(sunGroup);

    /* Four solar flares orbiting the limb — simple animated point sprites */
    const sunFlares = [];
    for (let i = 0; i < 4; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
      const mat = new THREE.PointsMaterial({
        color: 0xff6600, size: 0.35, transparent: true, opacity: 0.5,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
      });
      const pts = new THREE.Points(geo, mat);
      markBloom(pts);
      heroRoot.add(pts);
      sunFlares.push({ pts, mat, i });
    }

    const sunMats = [sunBodyMat, ...coronaShells.map(s => s.material)];

    /* ── Mercury & Mars — shared "rocky, cratered" body ── */
    const rockyCraterCalls = /* glsl */ `
      craterBowl(n, normalize(vec3( 0.55, 0.35, 0.70)), 0.34, 1.0) +
      craterBowl(n, normalize(vec3(-0.45, 0.60,-0.30)), 0.22, 0.8) +
      craterBowl(n, normalize(vec3( 0.15,-0.75, 0.45)), 0.28, 0.85) +
      craterBowl(n, normalize(vec3(-0.65,-0.25,-0.55)), 0.18, 0.65) +
      craterBowl(n, normalize(vec3( 0.75,-0.15,-0.35)), 0.15, 0.55)
    `;
    const rockySmallCalc = /* glsl */ `
      vec2 scV = cellular3(p * 6.5);
      float scOn   = step(0.5, scV.y);
      float scSize = 0.28 + scV.y * 0.30;
      float scBowl = smoothstep(scSize, 0.0, scV.x);
      float scRim  = exp(-pow((scV.x - scSize * 1.15) * 14.0, 2.0));
      float small  = scOn * (scRim * 0.30 - scBowl);
    `;
    const rockyVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        vec3 n = normalize(p);
        float rough = (fbm3(p * 9.0) - 0.5) * 0.07 + (fbmRidge3(p * 20.0) - 0.5) * 0.05;
        float craters = ${rockyCraterCalls};
        ${rockySmallCalc}
        return rough * 0.06 + craters * 0.044 + small * 0.017;
      }
      ${heroDisplaceMain}
    `;
    const rockyFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade, uPolar;
      uniform vec3 uBaseLow, uBaseHigh, uRimCol;
      uniform float uRimStrength;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 n = normalize(vP);
        vec3 p = vP;
        float alt = fbm3(vP * 4.0) * 0.5 + 0.5;
        vec3 base = mix(uBaseLow, uBaseHigh, alt);
        float craters = ${rockyCraterCalls};
        base *= 1.0 - clamp(-craters, 0.0, 1.0) * 0.40;
        base += clamp(craters, 0.0, 1.0) * 0.08;
        ${rockySmallCalc}
        base *= 1.0 - clamp(-small, 0.0, 1.0) * 0.30;
        base += clamp(small, 0.0, 1.0) * 0.06;
        float polarCap = smoothstep(0.80, 0.94, abs(vP.y)) * uPolar;
        base = mix(base, vec3(0.92, 0.94, 0.98), polarCap);
        /* Ridged high-frequency grit — rock, not cloud */
        float grit = fbmRidge3(vP * 34.0) - 0.5;
        base *= 0.90 + grit * 0.22;
        /* Harsh single-sun terminator — near-black shadow side, like
           real airless-body photography, not a soft ambient wash    */
        vec3 lit = base * (0.028 + lambert * 1.20);
        /* Rim strength/color set per body — Mercury (no air) gets
           almost none; Mars gets a thin dusty haze, not a glow      */
        float fr = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        lit += uRimCol * fr * uRimStrength;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.008) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `;
    function makeRockyMat(baseLow, baseHigh, polar, rimCol, rimStrength) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false,
        uniforms: {
          uTime: { value: 0 }, uFade: { value: 0 }, uPolar: { value: polar },
          uBaseLow: { value: new THREE.Vector3(...baseLow) },
          uBaseHigh: { value: new THREE.Vector3(...baseHigh) },
          uRimCol: { value: new THREE.Vector3(...rimCol) },
          uRimStrength: { value: rimStrength },
        },
        vertexShader: rockyVS, fragmentShader: rockyFS,
      });
    }
    /* Mercury: no atmosphere — almost no rim, just a hint of dust glint.
       True-color MESSENGER imagery is warmer/browner than the Moon, not
       neutral gray — a slight R>G>B cast on both the low and high albedo
       ends is what actually separates Mercury from a plain gray rock.   */
    const mercuryMat = makeRockyMat([0.38, 0.35, 0.32], [0.70, 0.65, 0.60], 0.0, [0.55, 0.50, 0.46], 0.035);

    /* Mars gets its own shader (not the shared generic rocky one Mercury
       uses) so it can carry its two most identifiable real features:
       Valles Marineris — the "deep gash" NASA's own site calls out —
       and Olympus Mons, the solar system's tallest volcano, which the
       info panel already claims but nothing was actually rendering.   */
    const marsCanyonCalc = /* glsl */ `
      /* Valles Marineris: a vast rift running across the disk, modeled
         as a bounded trench along one great-circle band on the sphere */
      vec3 canyonPlaneN = normalize(vec3(0.15, 0.92, 0.05));
      vec3 canyonDir = normalize(cross(canyonPlaneN, vec3(0.0, 0.0, 1.0)));
      float canyonCross = dot(n, canyonPlaneN);
      float canyonAlong = dot(n, canyonDir);
      float canyonEnds = smoothstep(1.0, 0.5, abs(canyonAlong));
      float canyonTrench = smoothstep(0.06, 0.0, abs(canyonCross)) * canyonEnds;
      float canyonRimBand = smoothstep(0.10, 0.06, abs(canyonCross)) * smoothstep(0.06, 0.10, abs(canyonCross)) * canyonEnds;
      float canyon = canyonRimBand * 0.35 - canyonTrench;
    `;
    const marsVolcanoCalc = /* glsl */ `
      /* Olympus Mons: a broad shield with a shallow summit caldera —
         a raised dome, not a crater bowl */
      float volcanoD = length(n - normalize(vec3(0.2, -0.1, 0.95))) / 0.34;
      float volcanoDome = smoothstep(1.0, 0.0, volcanoD);
      float volcanoCaldera = smoothstep(0.18, 0.0, volcanoD);
      float volcano = volcanoDome - volcanoCaldera * 0.5;
    `;
    const marsVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        vec3 n = normalize(p);
        float rough = (fbm3(p * 9.0) - 0.5) * 0.07 + (fbmRidge3(p * 20.0) - 0.5) * 0.05;
        float craters = ${rockyCraterCalls};
        ${rockySmallCalc}
        ${marsCanyonCalc}
        ${marsVolcanoCalc}
        return rough * 0.06 + craters * 0.044 + small * 0.017 + canyon * 0.05 + volcano * 0.10;
      }
      ${heroDisplaceMain}
    `;
    const marsFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade, uPolar;
      uniform vec3 uBaseLow, uBaseHigh, uRimCol;
      uniform float uRimStrength;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 n = normalize(vP);
        vec3 p = vP;
        float alt = fbm3(vP * 4.0) * 0.5 + 0.5;
        vec3 base = mix(uBaseLow, uBaseHigh, alt);
        float craters = ${rockyCraterCalls};
        base *= 1.0 - clamp(-craters, 0.0, 1.0) * 0.40;
        base += clamp(craters, 0.0, 1.0) * 0.08;
        ${rockySmallCalc}
        base *= 1.0 - clamp(-small, 0.0, 1.0) * 0.30;
        base += clamp(small, 0.0, 1.0) * 0.06;
        ${marsCanyonCalc}
        base *= 1.0 - clamp(-canyon, 0.0, 1.0) * 0.45; /* dust-shadowed trench floor */
        base += clamp(canyon, 0.0, 1.0) * 0.05;
        ${marsVolcanoCalc}
        base *= 1.0 - volcanoDome * 0.12;    /* darker basaltic flank */
        base *= 1.0 - volcanoCaldera * 0.35; /* darker summit caldera */
        float polarCap = smoothstep(0.80, 0.94, abs(vP.y)) * uPolar;
        base = mix(base, vec3(0.92, 0.94, 0.98), polarCap);
        float grit = fbmRidge3(vP * 34.0) - 0.5;
        base *= 0.90 + grit * 0.22;
        vec3 lit = base * (0.028 + lambert * 1.20);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        lit += uRimCol * fr * uRimStrength;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.008) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `;
    /* Mars: real but very thin CO2 atmosphere — a faint dusty pink-tan haze, not a glow */
    const marsMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {
        uTime: { value: 0 }, uFade: { value: 0 }, uPolar: { value: 1.0 },
        uBaseLow: { value: new THREE.Vector3(0.42, 0.15, 0.06) },
        uBaseHigh: { value: new THREE.Vector3(0.86, 0.42, 0.20) },
        uRimCol: { value: new THREE.Vector3(0.82, 0.52, 0.38) },
        uRimStrength: { value: 0.11 },
      },
      vertexShader: marsVS, fragmentShader: marsFS,
    });

    /* ── Venus — thick smooth swirling cloud deck ── */
    const venusMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        vec3 warp = vec3(
          fbm3(p * 2.0 + vec3(1.0, 0.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 1.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 0.0, 1.0))
        ) - 0.5;
        vec3 wp = p + warp * 1.1;
        float bands = fbm3(wp * 3.0 + vec3(uTime * 0.01, 0.0, 0.0)) * 0.6
                    + fbm3(wp * 7.0 - vec3(0.0, uTime * 0.008, 0.0)) * 0.4;
        float ridges = fbmRidge3(wp * 9.0 - vec3(0.0, 0.0, uTime * 0.012)) - 0.5;
        /* Real Venus (Mariner 10 / Akatsuki true color) is pale creamy
           white with tan cloud bands — much less saturated/orange than
           a "desert" palette; the sulfuric-acid haze washes everything out */
        vec3 base = mix(vec3(0.80, 0.72, 0.55), vec3(0.97, 0.93, 0.80), bands);
        base *= 0.94 + ridges * 0.14;
        /* Thick global atmosphere means Venus barely dims at the
           terminator in reality — a lower floor than an airless body,
           but still darker than the old flat "always half-lit" look */
        vec3 lit = base * (0.16 + lambert * 0.86);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
        lit += vec3(1.0, 0.92, 0.72) * fr * 0.28;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.008) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);

    /* ── Earth — real mountains on land, swirling clouds, city lights ── */
    const earthLandCalc = /* glsl */ `
      float landBase = fbm3(p * 2.6 + vec3(3.1, 1.7, 0.0));
      float landEdge = fbm3(p * 7.5 + vec3(1.4, 0.2, 2.6)) * 0.16;
      float land = smoothstep(0.46, 0.52, landBase + landEdge);
    `;
    const earthCloudCalc = /* glsl */ `
      vec3 warp = vec3(
        fbm3(p * 3.0 + vec3(1.0, 0.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 1.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 0.0, 1.0))
      ) - 0.5;
      vec3 wp = p + warp * 0.7;
      float cloudN = fbm3(wp * 4.0 + vec3(uTime * 0.02, 0.0, 0.0))
                   * fbm3(wp * 8.0 - vec3(0.0, uTime * 0.015, 0.0));
      float cloud = smoothstep(0.28, 0.60, cloudN);
    `;
    const earthVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        ${earthLandCalc}
        float terrain = fbm3(p * 6.0 + vec3(5.0, 2.0, 1.0)) * 0.5
                       + fbmRidge3(p * 13.0 + vec3(2.0, 0.0, 4.0)) * 0.5;
        float mountains  = (terrain - 0.5) * land;
        float oceanFloor = (fbm3(p * 3.0) - 0.5) * (1.0 - land);
        return mountains * 0.036 + oceanFloor * 0.006;
      }
      ${heroDisplaceMain}
    `;
    const earthMat = heroMaterial(earthVS, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthLandCalc}
        vec3 ocean = mix(vec3(0.02, 0.10, 0.32), vec3(0.04, 0.30, 0.58), fbm3(vP * 6.0) * 0.5 + 0.5);
        float biome = fbm3(vP * 1.3 + vec3(7.0, 3.0, 1.0));
        vec3 forestCol = vec3(0.13, 0.30, 0.11);
        vec3 desertCol = vec3(0.62, 0.48, 0.26);
        vec3 groundMix = mix(forestCol, desertCol, smoothstep(0.34, 0.66, biome));
        vec3 groundFine = mix(vec3(0.85, 0.80, 1.0), vec3(1.15, 1.05, 0.85), fbm3(vP * 6.5) * 0.5 + 0.5);
        float ridgeDetail = fbmRidge3(vP * 22.0) - 0.5;
        vec3 ground = groundMix * groundFine * (0.92 + ridgeDetail * 0.20);
        vec3 surf = mix(ocean, ground, land);
        float polar = smoothstep(0.74, 0.94, abs(vP.y));
        surf = mix(surf, vec3(0.90, 0.93, 0.97), polar);
        ${earthCloudCalc}
        surf *= 1.0 - cloud * 0.22;
        /* Ocean specular is broad and soft; ice/snow specular is
           tighter and brighter — real materials, not one fresnel */
        float specPower = mix(40.0, 140.0, polar);
        float specGain  = mix(0.5, 0.9, polar);
        float spec = pow(max(dot(reflect(-L, N), V), 0.0), specPower) * mix(1.0 - land, 1.0, polar) * specGain;
        /* Harsh terminator — near-black night side but for city lights */
        vec3 lit = surf * (0.032 + lambert * 1.10) + vec3(1.0) * spec;
        float night = 1.0 - smoothstep(0.0, 0.16, lambert);
        vec3 cell = floor(vP * 60.0);
        float city = step(0.978, h3(cell)) * step(0.5, land) * night;
        float twinkle = 0.6 + 0.4 * sin(uTime * 3.0 + h3(cell) * 30.0);
        lit += vec3(1.0, 0.85, 0.5) * city * twinkle * 0.9;
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.6);
        lit += vec3(0.25, 0.48, 1.0) * fr * 0.38;
        lit += (grain(gl_FragCoord.xy, uTime) * 0.008) * (0.3 + lambert);
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);
    const cloudMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthCloudCalc}
        gl_FragColor = vec4(vec3(1.0), cloud * (0.35 + lambert * 0.5) * uFade);
      }
    `, THREE.NormalBlending);

    /* ── Gas giants: Jupiter, Saturn, Uranus, Neptune ──
       Each gets its OWN atmosphere-rim color (matching its real
       composition) instead of one generic white-blue glow, a lower
       ambient floor for a harder terminator, and ridged (not just
       smooth-fbm) turbulence in the bands for sharper storm edges  */
    function gasGiantMat(colorExpr, rimCol, shadowExpr) {
      return heroMaterial(heroVS_plain, /* glsl */ `
        varying vec3 vN, vWP, vP;
        uniform float uTime, uFade;
        ${COMMON}
        void main() {
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vWP);
          vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
          float lambert = max(dot(N, L), 0.0);
          ${colorExpr}
          ${shadowExpr || ''}
          /* Limb darkening: the edge of a gas giant reads darker in
             real photography — this alone kills the "flat disc" look */
          float limb = pow(max(dot(N, V), 0.0), 0.45);
          col *= mix(0.45, 1.0, limb);
          vec3 lit = col * (0.055 + lambert * 1.05);
          float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
          lit += ${rimCol} * fr * 0.22;
          /* Phase-dependent atmospheric glow: backlit crescent
             brightens at the rim, like real spacecraft photography */
          float phaseAngle = dot(L, V);
          float backlit = smoothstep(0.0, -0.6, phaseAngle);
          lit += col * backlit * fr * 0.4;
          lit += (grain(gl_FragCoord.xy, uTime) * 0.008) * (0.3 + lambert);
          gl_FragColor = vec4(lit, uFade);
        }
      `, THREE.NormalBlending);
    }
    const jupiterMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.6 + vec3(5.0, 2.0, 0.0)) - 0.5) * 0.6
                 + (fbmRidge3(vP * 4.0 + vec3(1.0, 0.0, 0.0)) - 0.5) * 0.35;
      float bv = lat * 5.0 + warp;
      float b1 = sin(bv); float b2 = sin(bv * 2.3 + 1.0);
      vec3 col = mix(vec3(0.76, 0.60, 0.42), vec3(0.94, 0.84, 0.66), smoothstep(-0.3, 0.3, b1));
      col = mix(col, vec3(0.58, 0.40, 0.26), smoothstep(0.4, 0.7, b2) * 0.5);
      /* Great Red Spot: a real 3-D swirling ellipse, not a round blob —
         its own local tangent frame, a genuinely ROTATING internal
         warp (a cyclone, not a static texture), a tangential velocity
         field so the swirl reads as a spinning storm, and a pair of
         concentric eye-wall rings                                   */
      vec3 nP = normalize(vP);
      vec3 grsCenter = normalize(vec3(0.3, -0.18, 0.94));
      float grsU = dot(nP - grsCenter, normalize(vec3(-0.94, 0.0, 0.3)));
      float grsV = dot(nP - grsCenter, vec3(0.0, 1.0, 0.0));
      float grsDist = sqrt(grsU * grsU * 2.5 + grsV * grsV * 0.7) / 0.28;
      float grsMask = smoothstep(1.0, 0.0, grsDist);

      float grsAngle = uTime * 0.008; /* slow cyclone rotation */
      mat2 grsRot = mat2(cos(grsAngle), -sin(grsAngle), sin(grsAngle), cos(grsAngle));
      vec2 grsUV = grsRot * vec2(grsU, grsV);
      /* rebuild the rotated 2-D offset back into 3-D using the same
         tangent frame grsU/grsV were measured against, then use THAT
         to offset the noise sample — the swirl texture itself spins */
      vec3 grsOffset3D = grsUV.x * normalize(vec3(-0.94, 0.0, 0.3)) + grsUV.y * vec3(0.0, 1.0, 0.0);
      float tangential = atan(grsV, grsU) + uTime * 0.012; /* tangential velocity field */
      float grsWarp = fbm3(nP * 12.0 + grsOffset3D * 4.0 + vec3(uTime * 0.02, 0.0, 0.0)) - 0.5
                    + sin(tangential * 3.0) * 0.15;
      float grsRingA = exp(-pow((grsDist - 0.25) * 8.0, 2.0)) * 0.15;
      float grsRingB = exp(-pow((grsDist - 0.55) * 6.0, 2.0)) * 0.10;
      vec3 grsCol = mix(vec3(0.72, 0.28, 0.18), vec3(0.88, 0.48, 0.30), grsWarp + 0.5);
      col = mix(col, grsCol, grsMask * 0.85);
      col = mix(col, vec3(0.65, 0.22, 0.12), (grsRingA + grsRingB) * grsMask);
    `, 'vec3(0.88, 0.78, 0.60)');
    const saturnMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.4 + vec3(3.0, 1.0, 0.0)) - 0.5) * 0.4
                 + (fbmRidge3(vP * 3.5) - 0.5) * 0.25;
      float bv = lat * 6.0 + warp;
      vec3 col = mix(vec3(0.80, 0.72, 0.52), vec3(0.94, 0.88, 0.70), smoothstep(-0.4, 0.4, sin(bv)));
      col = mix(col, vec3(0.70, 0.60, 0.42), smoothstep(0.5, 0.8, sin(bv * 1.7)) * 0.3);
      /* Saturn's real north-pole hexagon: a persistent six-sided jet
         stream, unique among the planets and specifically NASA-noted —
         north pole only (lat > 0, not abs(lat)), not a generic polar cap */
      if (lat > 0.82) {
        float hexAngle = atan(vP.z, vP.x) * 3.0 / 3.14159265;
        float hexCell = fract(hexAngle);
        float hexBand = abs(hexCell - 0.5) * 2.0;
        col *= 0.85 + hexBand * 0.20;
      }
    `, 'vec3(0.92, 0.86, 0.66)', /* glsl */ `
      /* The ring casts a real shadow on the sunlit hemisphere: cast a
         ray from this surface point toward the Sun (object-space) and
         see where it crosses the ring plane (local y = 0)            */
      float ringShadowMul = 1.0;
      if (abs(L.y) > 0.0001) {
        float tHit = -vP.y / L.y;
        if (tHit > 0.0) {
          vec3 ringHit = vP + L * tHit;
          float rHit = length(ringHit.xz) / 0.56; /* Saturn's own radius */
          float ringDensity = fbm(vec2(rHit * 30.0, 0.5)) * 0.6 + 0.4;
          float ringOcclusion = smoothstep(0.0, 0.025, rHit - 1.5) * smoothstep(2.6, 2.55, rHit) * ringDensity * 0.75;
          ringShadowMul = 1.0 - ringOcclusion;
        }
      }
      lambert *= ringShadowMul;
    `);
    const uranusMat = gasGiantMat(/* glsl */ `
      /* Uranus is tipped ~98° on its side — its bands run around the
         axis that points at us/away from us, not the "up" axis, so
         they read as roughly VERTICAL stripes rather than horizontal */
      float lat = vP.z / (length(vP) + 0.0001);
      float bv = lat * 3.0 + (fbm3(vP * 1.2) - 0.5) * 0.15;
      vec3 col = mix(vec3(0.48, 0.82, 0.85), vec3(0.58, 0.90, 0.91), smoothstep(-0.6, 0.6, sin(bv)));
      float streaks = fbm(vec2(vP.z * 8.0, vP.x * 3.0 + uTime * 0.005)) * 0.06;
      col += vec3(streaks);
    `, 'vec3(0.68, 0.90, 0.90)');
    const neptuneMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.5 + vec3(2.0, 4.0, 0.0)) - 0.5) * 0.4
                 + (fbmRidge3(vP * 3.8 + vec3(0.0, 2.0, 0.0)) - 0.5) * 0.25;
      float bv = lat * 5.0 + warp;
      vec3 col = mix(vec3(0.06, 0.28, 0.74), vec3(0.16, 0.42, 0.88), smoothstep(-0.4, 0.4, sin(bv)));
      vec3 spotCenter = normalize(vec3(-0.2, 0.3, 0.92));
      float spotD = length(normalize(vP) - spotCenter) / 0.20;
      float spot = smoothstep(1.0, 0.0, spotD);
      col = mix(col, vec3(0.05, 0.16, 0.44), spot * 0.35);
    `, 'vec3(0.35, 0.55, 0.95)');

    /* Saturn: a true Cassini Division + a fainter Encke gap.
       Uranus: a single lighter gap — same shader body, a different
       gapExpr snippet swapped in at build time (no dynamic branching). */
    const SATURN_GAPS = /* glsl */ `
      float cassini = 1.0 - smoothstep(0.41, 0.44, rNorm) * (1.0 - smoothstep(0.50, 0.53, rNorm));
      float encke = 1.0 - smoothstep(0.70, 0.715, rNorm) * (1.0 - smoothstep(0.715, 0.73, rNorm)) * 0.6;
      float gapMul = cassini * encke;
    `;
    const URANUS_GAPS = /* glsl */ `
      float gapMul = 1.0 - smoothstep(0.53, 0.548, rNorm) * (1.0 - smoothstep(0.552, 0.57, rNorm)) * 0.5;
    `;
    function makeRing(innerR, outerR, baseCol, opac, gapExpr) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.NormalBlending,
        uniforms: {
          uInner: { value: innerR }, uOuter: { value: outerR }, uFade: { value: 0 },
          uCol: { value: new THREE.Vector3(...baseCol) }, uOpac: { value: opac },
        },
        vertexShader: /* glsl */ `
          varying vec3 vP;
          void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */ `
          varying vec3 vP;
          uniform float uInner, uOuter, uFade, uOpac;
          uniform vec3 uCol;
          ${COMMON}
          void main() {
            float r = length(vP.xy);
            float rNorm = clamp((r - uInner) / (uOuter - uInner), 0.0, 1.0);

            ${gapExpr || SATURN_GAPS}

            /* Ring band structure: radial fbm at two scales */
            float bands  = fbm(vec2(rNorm * 30.0, 0.5)) * 0.6 + 0.4;
            float detail = fbm(vec2(rNorm * 95.0, 1.3)) * 0.3 + 0.7;
            float radial = bands * detail;

            /* Real physics: phase angle between camera and Sun as seen
               from the ring — ice particles forward-scatter light, so
               a backlit ring (Sun roughly behind it from our view)
               glows far more than a frontlit one                    */
            vec3 ringPosWorld = (modelMatrix * vec4(vP, 1.0)).xyz;
            vec3 V = normalize(cameraPosition - ringPosWorld);
            vec3 sunDir = normalize(vec3(0.0, 0.0, -18.0) - ringPosWorld);
            float phase = dot(-V, sunDir); /* -1 frontlit, +1 backlit */
            float mie = pow(max(phase, 0.0), 3.0) * 0.8;

            vec3 col = mix(uCol * 0.5, uCol * 1.4, radial);
            col += uCol * mie * radial * 0.7;

            /* C-ring (innermost) is genuinely more transparent than B/A */
            float cRingFade = smoothstep(0.0, 0.30, rNorm) * 0.55 + 0.45;

            float edge = smoothstep(0.0, 0.025, rNorm) * smoothstep(1.0, 0.96, rNorm);
            float alpha = edge * (0.20 + radial * 0.55) * gapMul * cRingFade * uOpac * uFade;
            gl_FragColor = vec4(col, alpha);
          }
        `,
      });
      return new THREE.Mesh(new THREE.RingGeometry(innerR, outerR, 96), mat);
    }

    /* ── Volumetric atmosphere shell (rocky bodies + Earth only —
       gas giants get their own limb-darkening/backlit treatment
       baked straight into gasGiantMat instead). uAtmDensity scales
       the scatter brightness itself (a thin CO2 haze vs a thick
       sulfuric cloud deck), independent of the Fresnel falloff shape. */
    function makeAtmosphere(radius, atmCol, density) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: {
          uFade: { value: 0 },
          uAtmCol: { value: new THREE.Vector3(...atmCol) },
          uAtmDensity: { value: density == null ? 1.0 : density },
        },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform vec3 uAtmCol;
          uniform float uFade, uAtmDensity;
          void main() {
            vec3 V = normalize(cameraPosition - vWP);
            vec3 N = normalize(-vN); /* BackSide: normal points inward */
            float fr = pow(1.0 - max(dot(N, V), 0.0), 3.5);
            vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP); /* real Sun position */
            float sunlit = max(dot(-N, L), 0.0);
            vec3 scatter = uAtmCol * fr * (0.12 + sunlit * 0.88) * uAtmDensity;
            vec3 refl = reflect(-V, N);
            float limbSun = max(dot(refl, L), 0.0);
            scatter += uAtmCol * pow(limbSun, 5.0) * fr * 0.55 * uAtmDensity;
            float alpha = clamp(fr * 1.3, 0.0, 1.0) * uFade;
            gl_FragColor = vec4(scatter, alpha);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
    }

    /* Earth alone gets a real (aesthetically-scaled) single-scattering
       Rayleigh approximation instead of the generic sunlit/dark-side
       blend every other atmosphere shell uses — this is what produces
       the warm horizon band at sunrise/sunset a flat blue rim can't   */
    function makeEarthAtmosphere(radius, atmCol, density) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        uniforms: {
          uFade: { value: 0 },
          uAtmCol: { value: new THREE.Vector3(...atmCol) },
          uAtmDensity: { value: density == null ? 1.0 : density },
        },
        vertexShader: heroVS_plain,
        fragmentShader: /* glsl */ `
          varying vec3 vN, vWP, vP;
          uniform vec3 uAtmCol;
          uniform float uFade, uAtmDensity;
          void main() {
            vec3 V = normalize(cameraPosition - vWP);
            vec3 N = normalize(-vN);
            float fr = pow(1.0 - max(dot(N, V), 0.0), 3.5);
            vec3 L = normalize(vec3(0.0, 0.0, -18.0) - vWP);

            /* Rayleigh phase function: 3/4 (1 + cos^2(sun angle)).
               The (5.8, 13.5, 33.1) constants are the real relative
               per-wavelength scattering strengths (this is WHY the
               sky is blue — short/blue wavelengths scatter ~5.7x more
               than red); normalized to a unit-ish vector so they set
               the HUE while the phase function alone sets brightness —
               used at their literal ~1e-5 physical scale they render
               as black, so this keeps the ratio and drops the scale. */
            float mu = dot(N, L);
            float rayleigh = 0.75 * (1.0 + mu * mu);
            vec3 rayleighRatio = normalize(vec3(5.8, 13.5, 33.1));
            vec3 scatter = uAtmCol * rayleighRatio * rayleigh * fr * 2.0 * uAtmDensity;

            /* Sunrise/sunset: near the terminator the light path
               through atmosphere is longest — a warm horizon glow.
               smoothstep (not a hard step) so the band fades in
               instead of cutting off as a visible ring on the sphere */
            scatter += vec3(0.9, 0.4, 0.1) * 0.3 * exp(-abs(mu) * 8.0) * fr * uAtmDensity
                     * smoothstep(0.22, 0.15, abs(mu));

            vec3 refl = reflect(-V, N);
            float limbSun = max(dot(refl, L), 0.0);
            scatter += uAtmCol * pow(limbSun, 5.0) * fr * 0.55 * uAtmDensity;

            float alpha = clamp(fr * 1.3, 0.0, 1.0) * uFade;
            gl_FragColor = vec4(scatter, alpha);
          }
        `,
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 48), mat);
    }

    /* NOTE: planets no longer get a fake BackSide "glow halo" shell —
       real two-pass bloom (see the POST-PROCESSING block near the top)
       now provides that glow honestly, off the actual bright pixels
       (Sun, corona, atmosphere rims, ring highlights, meteor heads)
       instead of a hand-faked Fresnel sphere behind every body.     */

    /* ── Assemble the 8 hero bodies ──
       [name, radius, mat, extra] */
    const HERO_R = {
      Mercury: 0.34, Venus: 0.46, Earth: 0.48, Mars: 0.40,
      Jupiter: 0.62, Saturn: 0.56, Uranus: 0.50, Neptune: 0.48,
    };
    const heroDefs = [
      ['Mercury', mercuryMat, { glow: [0.95, 0.72, 0.38] }],
      ['Venus',   venusMat,   {
        atmos: [{ mul: 1.12, col: [1.0, 0.65, 0.20], density: 1.8 }],
        glow: [1.0, 0.70, 0.30],
      }],
      ['Earth',   earthMat,   {
        cloud: true,
        atmos: [
          { mul: 1.09, col: [0.18, 0.45, 1.00], density: 1.0 },
          { mul: 1.18, col: [0.10, 0.25, 0.80], density: 0.4 }, /* ionospheric glow */
        ],
        glow: [0.18, 0.50, 1.00],
      }],

       back — layered ON TOP of the scroll-driven dive as a pure additive
       offset (see focusPunch in the render loop) so it never fights or
       overrides the continuous scroll camera math, and always decays back
       to exactly where scroll alone would have put the camera.          */
    let focusPunch = 0;

      isDragging = false;

      if (moved < 6) {
        focusMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        focusMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        prevMouse = { x: e.clientX, y: e.clientY };

    /* ═══════════════════════════════════════════

    ═══════════════════════════════════════════ */
    let audio = null;
    function initAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -8; limiter.knee.value = 18; limiter.ratio.value = 8;
      limiter.attack.value = 0.003; limiter.release.value = 0.25;
      master.connect(limiter); limiter.connect(ctx.destination);
      master.gain.value = 0;
      master.gain.setTargetAtTime(0.24, ctx.currentTime, 2.0);

      /* ── Bright sustained pad, a full octave up from the old version
         and with NO low/sub layer under it at all — the previous mix's
         32Hz sub rumble + low-octave chord was read as heavy/ominous
         ("sad and scary"); this is deliberately all mid-and-up, a warm
         open Cmaj9 with nothing dark underneath it                    */
      const padFreqs = [261.63, 329.63, 392.00, 587.33]; // C4 E4 G4 D5
      padFreqs.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f; g.gain.value = i === 3 ? 0.04 : 0.055;
        o.connect(g); g.connect(master); o.start();
      });

      /* Tremolo LFO on pad layer — a touch faster than before, reads as
         a happy little "breathing" shimmer rather than a slow brood   */
      const padTremoloLFO = ctx.createOscillator();
      const padTremoloGain = ctx.createGain();
      padTremoloLFO.type = 'sine'; padTremoloLFO.frequency.value = 0.09;
      padTremoloGain.gain.value = 0.025;
      padTremoloLFO.connect(padTremoloGain);
      padTremoloGain.connect(master.gain);
      padTremoloLFO.start();

      /* ── High shimmer: C7 + D7 + G7 amplitude-modulated twinkle —
         no noise bed at all anymore (the old filtered-noise "wind" is
         exactly the kind of texture that reads as spooky, not joyful) */
      const shimmerLFO = ctx.createOscillator(), shimmerLFOG = ctx.createGain();
      shimmerLFO.type = 'sine'; shimmerLFO.frequency.value = 4.2;
      shimmerLFOG.gain.value = 0.006;
      shimmerLFO.connect(shimmerLFOG); shimmerLFO.start();
      [2093, 2349, 3136].forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.007;
        shimmerLFOG.connect(g.gain);
        o.connect(g); g.connect(master); o.start();
      });

      /* ── Playful arpeggio — a plucked major-pentatonic run (C D E G A,
         two octaves) with a fast pluck envelope, tied to `wp` (closed
         over from the render loop's own scope) so it brightens and
         speeds up very slightly the deeper the journey goes            */
      const arpNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

         accumulating every frame would drift the camera off-axis
         forever instead of gently oscillating in place.              */
      camera.position.x = arcX + mouseParallaxX + Math.sin(t * 0.23) * 0.007;
      camera.position.y = arcY + mouseParallaxY + Math.cos(t * 0.17) * 0.005;
      camera.position.z = camZ + Math.sin(t * 0.31) * 0.003 + Math.sin(t * 0.15) * 0.05;
      /* The arc moves the camera a real distance off-axis (unlike the
         old pure-Z push), so it has to re-aim at the origin every
         frame — otherwise the swing reads as a sideways strafe past
         the planet instead of an arc AROUND it while staying framed */
      camera.lookAt(0, 0, 0);

      renderWithBloom();
      drawLensFlare(sunFade);

      /* Detail inset: a slow close-up orbit around whichever planet is
         currently in view, sharing the same scene/lighting but with its
         own tight framing — no bloom pass, so surface detail (craters,
         bands, rings) actually reads crisper here than in the main view */
      detailOrbitT += dt * 0.15;
      {
        const stage = heroStages[floorWorld];
        const baseR = HERO_R[heroDefs[floorWorld][0]] || 0.5;
        const effR = Math.max(0.02, baseR * stage.group.scale.x);
        stage.group.getWorldPosition(detailCenter);
        const dist = effR * 2.6;
        detailCamera.position.set(
          detailCenter.x + Math.cos(detailOrbitT) * dist,
          detailCenter.y + effR * 0.5,
          detailCenter.z + Math.sin(detailOrbitT) * dist
        );
        detailCamera.lookAt(detailCenter);
        detailRenderer.render(scene, detailCamera);
      }
    })();

  })(); /* end IIFE */
  </script>
