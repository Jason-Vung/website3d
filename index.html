<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crystal Solar System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;500&display=swap">
  <style>
    /* ═══════════════════════════════════════════════════
       BASE STYLES
    ═══════════════════════════════════════════════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #010008;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    /* ── Hint text ── */
    .hint {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font: 300 9px/1 'Cinzel', serif;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(180, 140, 255, .22);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Sound toggle button ── */
    #sndBtn {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top, 0px));
      right: calc(20px + env(safe-area-inset-right, 0px));
      font: 300 9px/1 'Cinzel', serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(180, 150, 255, .32);
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(180, 150, 255, .18);
      padding: 6px 11px;
      transition: color .3s, border-color .3s;
      z-index: 20;
    }
    @media (max-width: 640px), (pointer: coarse) {
      #sndBtn { padding: 10px 14px; font-size: 10px; } /* bigger tap target */
    }
    #sndBtn:hover { color: rgba(210, 185, 255, .6); border-color: rgba(210, 185, 255, .38); }
    #sndBtn.on   { color: rgba(140, 210, 255, .6); border-color: rgba(140, 210, 255, .35); }

    /* ── Intro veil (fade-in overlay) ── */
    #veil {
      position: fixed;
      inset: 0;
      background: #010008;
      pointer-events: none;
      z-index: 60;
      opacity: 1;
      transition: opacity 2.5s ease-in-out;
    }

    /* ── Floating name labels, one per body, screen-projected ── */
    #labels {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }
    .planetLabel {
      position: absolute;
      transform: translate(-50%, 6px);
      font: 300 10px/1 'Cinzel', serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(235, 232, 250, .82);
      text-shadow: 0 0 6px rgba(0, 0, 0, .85), 0 0 16px rgba(130, 160, 255, .35);
      white-space: nowrap;
      transition: opacity .25s ease;
    }
    .planetLabel.sunLabel {
      font-size: 12px;
      letter-spacing: .22em;
      color: rgba(255, 230, 180, .92);
      text-shadow: 0 0 8px rgba(0, 0, 0, .8), 0 0 18px rgba(255, 180, 80, .5);
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>
  <div class="hint">kéo để xoay hệ · cuộn để phóng to / thu nhỏ</div>
  <div id="sndBtn">♪ sound</div>
  <div id="labels"></div>
  <div id="veil"></div>

  <!-- ═══════════════════════════════════════════════════
       VEIL REMOVAL — runs independently of Three.js
  ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      function fadeVeil() {
        var v = document.getElementById('veil');
        if (!v) return;
        v.style.opacity = '0';
        setTimeout(function () {
          if (v.parentNode) v.parentNode.removeChild(v);
        }, 2800);
      }
      setTimeout(fadeVeil, 400);
    })();
  </script>

  <!-- Three.js r134 from cdnjs (allowed CDN in artifact sandbox) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- ═══════════════════════════════════════════════════
       MAIN SCENE
  ═══════════════════════════════════════════════════ -->
  <script>
  (function () {
    if (typeof THREE === 'undefined') {
      console.error('[scene] THREE.js failed to load — cannot render scene.');
      return;
    }

    /* ═══════════════════════════════════════════
       RENDERER + CAMERA
    ═══════════════════════════════════════════ */
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('c'),
      antialias: true,
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.sortObjects = true;

    /* Portrait / narrow phone screens get a wider vertical FOV so the
       whole spread-out system still fits the frame                  */
    function restFov() {
      const aspect = W() / H();
      return aspect < 0.8 ? 62 : aspect < 1.05 ? 52 : 42;
    }

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(restFov(), W() / H(), 0.05, 200);
    const CAM_Y = 3.4; /* fixed elevation for the 3/4 overhead view */
    camera.position.set(0, CAM_Y, 15.5);
    camera.lookAt(0, 0, 0);

    /* ═══════════════════════════════════════════
       SHARED GLSL — injected into all ShaderMaterials
       NO for-loops — all shaders must be loop-free to
       avoid WebGL ES driver incompatibilities
    ═══════════════════════════════════════════ */
    const COMMON = /* glsl */ `
      float h2(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5);
      }
      float h3(vec3 p) {
        return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5);
      }
      float n2(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(h2(i),             h2(i + vec2(1.0, 0.0)), f.x),
          mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }
      float fbm(vec2 p) {
        return 0.5 * n2(p) + 0.25 * n2(p * 2.0) + 0.125 * n2(p * 4.0);
      }
      float fbm3(vec3 p) {
        return 0.5 * n2(p.xy) + 0.25 * n2(p.yz * 2.0) + 0.125 * n2(p.xz * 4.0);
      }
      /* Cellular (Voronoi) distance to the nearest of 9 randomly
         jittered lattice points — solar granulation, small craters.
         3×3 neighborhood fully unrolled (no dynamic loop); the
         running minimum uses step()/mix() to stay branch-free.     */
      vec2 voronoi2(vec2 p) {
        vec2 ip = floor(p);
        vec2 fp = fract(p);
        float bd = 8.0;
        float bid = 0.0;
        vec2 g, o, r; float d, s;
        g = vec2(-1.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0,-1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2(-1.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0, 0.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2(-1.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 0.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        g = vec2( 1.0, 1.0); o = g + vec2(h2(ip+g), h2(ip+g+vec2(11.3,7.1))); r = o-fp; d = dot(r,r);
        s = step(d, bd); bid = mix(bid, h2(ip+g+vec2(3.1,9.7)), s); bd = min(bd, d);
        return vec2(sqrt(bd), bid);
      }
      vec2 cellular3(vec3 p) {
        vec2 a = voronoi2(p.xy);
        vec2 b = voronoi2(p.yz);
        vec2 c = voronoi2(p.xz);
        float m = min(a.x, min(b.x, c.x));
        float id = mix(mix(c.y, b.y, step(b.x, c.x)), a.y, step(a.x, min(b.x, c.x)));
        return vec2(m, id);
      }
      /* Radial crater profile — a real dish-shaped dent with a
         slightly raised rim, evaluated on the unit-sphere direction. */
      float craterBowl(vec3 n, vec3 center, float radius, float depth) {
        float d = length(n - center) / radius;
        float bowl = smoothstep(1.0, 0.0, d);
        float rim  = exp(-pow((d - 1.05) * 6.0, 2.0));
        return depth * (rim * 0.45 - bowl);
      }
      float starburst(vec3 N, vec3 V, vec3 L, float sh) {
        vec3 H    = normalize(L + V);
        float core = pow(max(dot(N, H), 0.0), sh);
        vec3 R    = normalize(cross(V, vec3(0.0, 1.0, 0.001)));
        vec3 U    = normalize(cross(R, V));
        vec3 refl = reflect(-V, N);
        float rr  = dot(refl, R);
        float ru  = dot(refl, U);
        float ld  = max(0.0, dot(refl, L));
        float spk =
          exp(-rr*rr*150.0) * exp(-ru*ru*2800.0) +
          exp(-ru*ru*150.0) * exp(-rr*rr*2800.0) +
          exp(-(rr+ru)*(rr+ru)*220.0) * exp(-(rr-ru)*(rr-ru)*2800.0) +
          exp(-(rr-ru)*(rr-ru)*220.0) * exp(-(rr+ru)*(rr+ru)*2800.0);
        return core + spk * 0.5 * ld;
      }
    `;

    /* ═══════════════════════════════════════════
       BACKGROUND — fullscreen quad via clip-space trick
    ═══════════════════════════════════════════ */
    const bgMat = new THREE.ShaderMaterial({
      depthWrite: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.999, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec2 vUv;
        uniform float uTime;
        ${COMMON}
        void main() {
          vec2 uv = vUv - 0.5;
          float t = uTime * 0.0012;

          vec3 col = mix(
            vec3(0.030, 0.010, 0.115),
            vec3(0.008, 0.003, 0.045),
            length(uv) * 1.8
          );

          float nc1 = fbm(uv * 2.1 + vec2(t, 0.0));
          float nc2 = fbm(uv * 3.7 + nc1 * 0.4 + vec2(0.1, t * 1.1));
          float nc3 = fbm(uv * 6.2 + nc2 * 0.26 - vec2(t * 0.9, t * 1.3));

          col += vec3(0.42, 0.05, 0.72) * smoothstep(0.30, 0.82, nc1)
                 * smoothstep(0.52, 0.0, length(uv + vec2(-0.08, 0.07))) * 0.28;
          col += vec3(0.04, 0.52, 0.82) * smoothstep(0.36, 0.80, nc2)
                 * smoothstep(0.48, 0.0, length(uv + vec2(0.20, -0.14))) * 0.20;
          col += vec3(0.06, 0.22, 0.88) * smoothstep(0.44, 0.82, nc3) * 0.11;
          col += vec3(0.80, 0.06, 0.58) * smoothstep(0.60, 0.96, nc1 * nc2) * 0.10;
          col += vec3(0.70, 0.36, 0.06) * smoothstep(0.30, 0.0, length(uv)) * 0.15;

          float mwD    = uv.x * 0.72 + uv.y * 0.54;
          float mwFall = smoothstep(0.34, 0.0, abs(mwD));
          float mwN1   = fbm(uv * 5.4  + vec2(t * 0.28, 0.0))
                       * fbm(uv * 10.2 + vec2(-0.22, t * 0.40));
          float mwN2   = fbm((uv + mwN1 * 0.10) * 6.8 + vec2(t * 0.16, t * 0.23));
          float mwBand = mwFall * (mwN1 * 0.74 + mwN2 * 0.26);
          col += vec3(0.38, 0.42, 0.74) * mwBand * 0.92;
          col += vec3(0.58, 0.54, 0.94) * smoothstep(0.14, 0.0, abs(mwD)) * mwN1 * 0.68;
          col += vec3(0.11, 0.09, 0.32) * mwFall * 0.28;
          col += vec3(0.70, 0.66, 0.98)
                 * smoothstep(0.07, 0.0, abs(mwD))
                 * smoothstep(0.32, 0.54, mwN2) * 0.52;

          vec2 gA = vUv * vec2(212.0, 136.0);
          vec2 cA = floor(gA);
          vec2 fA = fract(gA);
          float rA1 = h2(cA);
          float rA2 = h2(cA + vec2(41.2, 83.7));
          float rA3 = h2(cA + vec2(22.9, 61.4));
          float rA4 = h2(cA + vec2(93.5, 37.2));
          float rA5 = h2(cA + vec2(57.8, 15.1));
          float rA6 = h2(cA + vec2(19.3, 78.6));
          float visA = step(0.50, rA1);
          float dA   = length(fA - vec2(rA2, rA3));
          float szA  = 0.0020 + rA4 * 0.0095;
          float blA  = 0.48 + 0.52 * sin(uTime * (0.20 + rA6 * 1.65) + rA1 * 22.5);
          float mbA  = 1.0 + mwBand * 3.0;
          float bA   = smoothstep(szA * 2.0, 0.0, dA) * blA * (0.08 + rA4 * 0.85) * mbA * visA;
          vec3 scA = rA5 < 0.20 ? mix(vec3(0.42, 0.58, 1.0), vec3(0.76, 0.88, 1.0), rA4) :
                     rA5 < 0.62 ? mix(vec3(0.86, 0.91, 1.0), vec3(1.0,  1.0,  0.94), rA4) :
                     rA5 < 0.82 ? mix(vec3(1.0,  0.92, 0.73), vec3(1.0, 0.84, 0.56), rA4) :
                                  vec3(1.0, 0.66, 0.42);
          col += scA * bA;
          float flareA = step(0.80, rA4);
          col += scA * (
            exp(-abs(fA.x - rA2) * 230.0) * exp(-dA * dA * 360.0) +
            exp(-abs(fA.y - rA3) * 230.0) * exp(-dA * dA * 360.0)
          ) * bA * 2.1 * flareA;

          vec2 gB = vUv * vec2(91.0, 58.0);
          vec2 cB = floor(gB);
          vec2 fB = fract(gB);
          float rB1 = h2(cB + vec2(5.1,  8.7));
          float rB2 = h2(cB + vec2(14.5, 71.3));
          float rB3 = h2(cB + vec2(62.1, 29.8));
          float rB4 = h2(cB + vec2(43.8, 57.2));
          float rB6 = h2(cB + vec2(33.7, 91.4));
          float visB = step(0.68, rB1);
          float dB   = length(fB - vec2(rB2, rB3));
          float szB  = 0.004 + rB4 * 0.015;
          float blB  = 0.55 + 0.45 * sin(uTime * (0.28 + rB6 * 1.4) + rB1 * 18.0);
          float mbB  = 1.0 + mwBand * 2.2;
          float bB   = smoothstep(szB * 2.0, 0.0, dB) * blB * (0.14 + rB4 * 0.72) * mbB * visB;
          vec3 scB = mix(vec3(0.88, 0.93, 1.0), vec3(1.0, 0.96, 0.88), rB4);
          col += scB * bB;
          col += scB * (
            exp(-abs(fB.x - rB2) * 150.0) * exp(-dB * dB * 210.0) +
            exp(-abs(fB.y - rB3) * 150.0) * exp(-dB * dB * 210.0)
          ) * bB * 3.2;

          vec2 gC = vUv * vec2(35.0, 22.0);
          vec2 cC = floor(gC);
          vec2 fC = fract(gC);
          float rC1 = h2(cC + vec2(11.3, 55.8));
          float rC2 = h2(cC + vec2(77.4, 18.2));
          float rC3 = h2(cC + vec2(28.6, 84.5));
          float rC4 = h2(cC + vec2(63.1, 42.9));
          float rC5 = h2(cC + vec2(9.8,  67.3));
          float visC = step(0.80, rC1);
          float dC   = length(fC - vec2(rC2, rC3));
          float szC  = 0.008 + rC4 * 0.022;
          float blC  = 0.60 + 0.40 * sin(uTime * (0.35 + rC5 * 1.2) + rC1 * 14.0);
          float bC   = smoothstep(szC * 2.0, 0.0, dC) * blC
                       * (0.25 + rC4 * 0.75) * (1.0 + mwBand * 1.8) * visC;
          vec3 scC = mix(vec3(1.0, 0.95, 0.90), vec3(0.80, 0.90, 1.0), rC4);
          col += scC * bC;
          col += scC * (
            exp(-abs(fC.x - rC2) * 80.0) * exp(-dC * dC * 120.0) +
            exp(-abs(fC.y - rC3) * 80.0) * exp(-dC * dC * 120.0)
          ) * bC * 4.5;

          vec2 fa = vec2( 0.22,  0.34);
          vec2 fb = vec2(-0.31,  0.18);
          vec2 fc = vec2( 0.40, -0.23);
          vec2 fd = vec2(-0.17, -0.41);
          vec2 fe = vec2( 0.11,  0.45);
          vec2 ff = vec2(-0.44, -0.07);
          float ba = 0.55 + 0.45 * sin(uTime * 0.42 + 0.8);
          float bb = 0.55 + 0.45 * sin(uTime * 0.58 + 2.3);
          float bc = 0.55 + 0.45 * sin(uTime * 0.35 + 4.1);
          float bd = 0.55 + 0.45 * sin(uTime * 0.65 + 1.5);
          float be = 0.55 + 0.45 * sin(uTime * 0.48 + 3.7);
          float bf = 0.55 + 0.45 * sin(uTime * 0.52 + 5.2);
          col += vec3(0.90, 0.94, 1.0) * smoothstep(0.007, 0.0, length(uv - fa)) * ba * 2.2;
          col += vec3(0.86, 0.90, 1.0) * smoothstep(0.005, 0.0, length(uv - fb)) * bb * 1.9;
          col += vec3(0.95, 0.92, 1.0) * smoothstep(0.008, 0.0, length(uv - fc)) * bc * 2.4;
          col += vec3(0.90, 0.88, 1.0) * smoothstep(0.005, 0.0, length(uv - fd)) * bd * 1.8;
          col += vec3(0.88, 0.93, 1.0) * smoothstep(0.006, 0.0, length(uv - fe)) * be * 2.0;
          col += vec3(0.96, 0.95, 1.0) * smoothstep(0.009, 0.0, length(uv - ff)) * bf * 2.6;
          col += vec3(0.90, 0.94, 1.0) * (
            exp(-(uv.x-fa.x)*(uv.x-fa.x)*1800.0) * exp(-(uv.y-fa.y)*(uv.y-fa.y)*6200.0) +
            exp(-(uv.y-fa.y)*(uv.y-fa.y)*1800.0) * exp(-(uv.x-fa.x)*(uv.x-fa.x)*6200.0)
          ) * ba * 0.55;
          col += vec3(0.95, 0.92, 1.0) * (
            exp(-(uv.x-fc.x)*(uv.x-fc.x)*1800.0) * exp(-(uv.y-fc.y)*(uv.y-fc.y)*6200.0) +
            exp(-(uv.y-fc.y)*(uv.y-fc.y)*1800.0) * exp(-(uv.x-fc.x)*(uv.x-fc.x)*6200.0)
          ) * bc * 0.60;
          col += vec3(0.96, 0.95, 1.0) * (
            exp(-(uv.x-ff.x)*(uv.x-ff.x)*1800.0) * exp(-(uv.y-ff.y)*(uv.y-ff.y)*6200.0) +
            exp(-(uv.y-ff.y)*(uv.y-ff.y)*1800.0) * exp(-(uv.x-ff.x)*(uv.x-ff.x)*6200.0)
          ) * bf * 0.70;

          col *= smoothstep(1.0, 0.26, length(uv));
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
    bgMesh.renderOrder = -10;
    scene.add(bgMesh);

    /* ═══════════════════════════════════════════
       COSMIC GROUP — 3-D star cloud, Milky Way disc,
       cosmic dust, an asteroid belt, shooting stars
    ═══════════════════════════════════════════ */
    const cosmicGroup = new THREE.Group();
    scene.add(cosmicGroup);

    const STARS3D = 5000;
    const s3P = new Float32Array(STARS3D * 3);
    const s3C = new Float32Array(STARS3D * 3);
    for (let i = 0; i < STARS3D; i++) {
      const r  = 9 + Math.pow(Math.random(), 0.38) * 24;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      s3P[i*3]   = r * Math.sin(ph) * Math.cos(th);
      s3P[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      s3P[i*3+2] = r * Math.cos(ph);
      const t2 = Math.random();
      const b  = 0.04 + Math.random() * 0.28;
      let rc, gc, bc;
      if      (t2 < 0.20) { rc = (0.40 + Math.random() * 0.3)  * b; gc = (0.60 + Math.random() * 0.2)  * b; bc = b; }
      else if (t2 < 0.70) { rc = (0.87 + Math.random() * 0.13) * b; gc = (0.90 + Math.random() * 0.10) * b; bc = (0.93 + Math.random() * 0.07) * b; }
      else if (t2 < 0.88) { rc = b; gc = (0.85 + Math.random() * 0.12) * b; bc = (0.55 + Math.random() * 0.2) * b; }
      else                { rc = b; gc = (0.50 + Math.random() * 0.22) * b; bc = (0.32 + Math.random() * 0.2) * b; }
      s3C[i*3] = rc; s3C[i*3+1] = gc; s3C[i*3+2] = bc;
    }
    const s3Geo = new THREE.BufferGeometry();
    s3Geo.setAttribute('position', new THREE.BufferAttribute(s3P, 3));
    s3Geo.setAttribute('color',    new THREE.BufferAttribute(s3C, 3));
    const starCloud = new THREE.Points(s3Geo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.045, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    starCloud.renderOrder = -4;
    cosmicGroup.add(starCloud);

    const MW = 7000;
    const mwP = new Float32Array(MW * 3);
    const mwC = new Float32Array(MW * 3);
    for (let i = 0; i < MW; i++) {
      const r     = 4 + Math.pow(Math.random(), 0.32) * 22;
      const theta = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * 0.4 / (1 + r * 0.05);
      mwP[i*3]   = r * Math.cos(theta);
      mwP[i*3+1] = height;
      mwP[i*3+2] = r * Math.sin(theta);
      const density = Math.max(0, 1 - (r - 4) / 22);
      const bright  = (0.04 + Math.random() * 0.32) * density;
      const ct = Math.random();
      let rc, gc, bc;
      if      (ct < 0.28) { rc = (0.38 + Math.random() * 0.28) * bright; gc = (0.58 + Math.random() * 0.24) * bright; bc = bright; }
      else if (ct < 0.72) { rc = (0.84 + Math.random() * 0.16) * bright; gc = (0.88 + Math.random() * 0.12) * bright; bc = bright; }
      else if (ct < 0.88) { rc = bright; gc = (0.87 + Math.random() * 0.13) * bright; bc = (0.64 + Math.random() * 0.22) * bright; }
      else                { rc = bright; gc = (0.68 + Math.random() * 0.22) * bright; bc = (0.42 + Math.random() * 0.2)  * bright; }
      mwC[i*3] = rc; mwC[i*3+1] = gc; mwC[i*3+2] = bc;
    }
    const mwGeo = new THREE.BufferGeometry();
    mwGeo.setAttribute('position', new THREE.BufferAttribute(mwP, 3));
    mwGeo.setAttribute('color',    new THREE.BufferAttribute(mwC, 3));
    const milkyWayGrp = new THREE.Group();
    milkyWayGrp.rotation.x = Math.PI / 3.0;
    milkyWayGrp.rotation.z = 0.52;
    cosmicGroup.add(milkyWayGrp);
    const mwPoints = new THREE.Points(mwGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.035, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    mwPoints.renderOrder = -3;
    milkyWayGrp.add(mwPoints);

    const DUST = 500;
    const dPos = new Float32Array(DUST * 3);
    const dCol = new Float32Array(DUST * 3);
    const dPal = [
      [0.55, 0.12, 0.95], [0.08, 0.52, 0.95],
      [0.00, 0.88, 0.78], [0.92, 0.12, 0.62],
      [1.00, 0.72, 0.18], [0.32, 0.72, 1.00],
    ];
    for (let i = 0; i < DUST; i++) {
      const r  = 5 + Math.random() * 14;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      dPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      dPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      dPos[i*3+2] = r * Math.cos(ph) - 6;
      const c = dPal[Math.floor(Math.random() * dPal.length)];
      const b = 0.06 + Math.random() * 0.22;
      dCol[i*3] = c[0]*b; dCol[i*3+1] = c[1]*b; dCol[i*3+2] = c[2]*b;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
    dustGeo.setAttribute('color',    new THREE.BufferAttribute(dCol, 3));
    const dustPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.05, transparent: true, opacity: 1,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
    }));
    dustPoints.renderOrder = -3;
    cosmicGroup.add(dustPoints);

    /* ── Asteroid belt (sits naturally between Mars and Jupiter's
       orbit radii below) ── */
    const asteroidVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      void main() {
        vN  = normalize(normalMatrix * normal);
        vP  = position;
        vWP = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const asteroidFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      void main() {
        vec3 N  = normalize(vN);
        vec3 V  = normalize(cameraPosition - vWP);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.5);
        float rock = fbm3(vP * 5.0) + fbm3(vP * 11.0) * 0.5 + fbm3(vP * 22.0) * 0.25;
        rock = rock * 0.5 + 0.5;
        vec3 col = mix(vec3(0.10, 0.08, 0.07), vec3(0.22, 0.18, 0.14), clamp(rock, 0.0, 1.0));
        col += step(0.76, rock) * 0.10;
        vec3 L = normalize(vec3(0.8, 1.4, 2.0));
        col += pow(max(dot(N, normalize(L + V)), 0.0), 28.0) * 0.22;
        col += mix(vec3(0.40, 0.07, 0.72), vec3(0.06, 0.38, 0.85), fbm3(vP * 1.5)) * fr * 0.58;
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const aOrbits = [
      [2.05,  0.05,  0.30, 0.016, 0.5,  0.028],
      [2.12, -0.03,  0.72, 0.011, 2.2,  0.034],
      [2.22,  0.02, -0.58, 0.0075,3.9,  0.024],
      [2.30,  0.06,  0.15, 0.014, 1.4,  0.020],
      [2.38, -0.04,  0.84, 0.006, 3.6,  0.038],
      [2.18,  0.03, -0.42, 0.019, 0.9,  0.022],
      [2.45, -0.05,  0.52, 0.009, 2.8,  0.030],
      [2.28,  0.04,  1.05, 0.008, 5.0,  0.026],
      [2.15,  0.02, -0.20, 0.013, 1.9,  0.021],
      [2.42,  0.03,  0.40, 0.010, 4.4,  0.032],
    ];
    const asteroidPivots = [];
    aOrbits.forEach(([orbitR, tX, tZ, spd, ang, sz]) => {
      const mat = new THREE.ShaderMaterial({
        side: THREE.FrontSide, uniforms: {},
        vertexShader: asteroidVS, fragmentShader: asteroidFS,
      });
      const geo = new THREE.SphereGeometry(sz, 6, 6);
      const pos = geo.attributes.position;
      for (let j = 0; j < pos.count; j++) {
        const x = pos.getX(j), y = pos.getY(j), z = pos.getZ(j);
        const r = Math.sqrt(x*x + y*y + z*z);
        const d = 1 + (Math.random() - 0.5) * 0.72;
        pos.setXYZ(j, x/r*r*d, y/r*r*d, z/r*r*d);
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = orbitR;
      mesh.userData = { rx: 0.003 + Math.random() * 0.006, rz: 0.002 + Math.random() * 0.005 };
      const pivot = new THREE.Group();
      pivot.rotation.x = tX;
      pivot.rotation.z = tZ;
      pivot.rotation.y = ang;
      pivot.add(mesh);
      cosmicGroup.add(pivot);
      asteroidPivots.push({ pivot, spd, mesh });
    });

    /* ═══════════════════════════════════════════
       SHOOTING STARS
    ═══════════════════════════════════════════ */
    const N_MET = 10;
    const ACTIVE_DUR = 12.0;
    const metColors = [
      [1.00, 0.96, 0.82], [0.62, 0.88, 1.00], [0.42, 1.00, 0.92],
      [1.00, 0.52, 0.88], [0.80, 0.52, 1.00], [1.00, 0.88, 0.42],
      [0.72, 1.00, 0.58], [0.90, 0.78, 1.00],
    ];
    const tailPos = new Float32Array(N_MET * 6);
    const tailCol = new Float32Array(N_MET * 6);
    const headPos = new Float32Array(N_MET * 3);
    const headCol = new Float32Array(N_MET * 3);
    const metData = [];
    for (let m = 0; m < N_MET; m++) {
      const ang   = Math.random() * Math.PI * 2;
      const slope = (Math.random() - 0.5) * 0.5 - 0.08;
      let dx = Math.cos(ang), dy = Math.sin(ang) + slope, dz = (Math.random() - 0.5) * 0.12;
      const dl = Math.sqrt(dx*dx + dy*dy + dz*dz);
      dx /= dl; dy /= dl; dz /= dl;
      metData.push({
        dx, dy, dz,
        speed: 0.28 + Math.random() * 0.60,
        trail: 5.5 + Math.random() * 7.5,
        period: 15 + Math.random() * 22,
        phase: Math.random() * 40,
        sx: -dx * (8 + Math.random() * 6),
        sy: -dy * (8 + Math.random() * 6) + (Math.random() - 0.5) * 3,
        sz: -1 + Math.random() * 4,
        bright: 0.65 + Math.random() * 0.35,
        col: metColors[m % metColors.length],
      });
    }
    const tailGeo = new THREE.BufferGeometry();
    tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
    tailGeo.setAttribute('color',    new THREE.BufferAttribute(tailCol, 3));
    const meteorLines = new THREE.LineSegments(tailGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    }));
    meteorLines.renderOrder = 9;
    cosmicGroup.add(meteorLines);
    const headGeo = new THREE.BufferGeometry();
    headGeo.setAttribute('position', new THREE.BufferAttribute(headPos, 3));
    headGeo.setAttribute('color',    new THREE.BufferAttribute(headCol, 3));
    const meteorHeads = new THREE.Points(headGeo, new THREE.PointsMaterial({
      vertexColors: true, size: 0.20, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
      sizeAttenuation: true,
    }));
    meteorHeads.renderOrder = 9;
    cosmicGroup.add(meteorHeads);

    /* ═══════════════════════════════════════════
       SOLAR SYSTEM — Sun at the center, 8 planets
       each on their own orbiting pivot. Every solid
       body displaces its own geometry along a noise
       height field (real relief, not a texture trick)
       and reconstructs the normal by finite
       differences so lighting reacts to the bumps.
    ═══════════════════════════════════════════ */
    const solarGroup = new THREE.Group();
    scene.add(solarGroup);

    const heroDisplaceMain = /* glsl */ `
      void main() {
        vec3 n0 = normalize(position);
        vec3 up = abs(n0.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 t1 = normalize(cross(n0, up));
        vec3 t2 = normalize(cross(n0, t1));
        float eps = 0.01;
        float h0 = heroHeight(position);
        float h1 = heroHeight(position + t1 * eps);
        float h2 = heroHeight(position + t2 * eps);
        vec3 dp0 = position + n0 * h0;
        vec3 dp1 = position + t1 * eps + n0 * h1;
        vec3 dp2 = position + t2 * eps + n0 * h2;
        vec3 faceN = normalize(cross(dp1 - dp0, dp2 - dp0));
        vec3 objN  = normalize(mix(normal, faceN, 0.85));
        vN  = normalize(normalMatrix * objN);
        vP  = position;
        vWP = (modelMatrix * vec4(dp0, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(dp0, 1.0);
      }
    `;
    const plainMain = /* glsl */ `
      void main() {
        vN  = normalize(normalMatrix * normal);
        vP  = position;
        vWP = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
    const heroVS_plain = /* glsl */ `varying vec3 vN, vWP, vP; ${plainMain}`;

    function heroMaterial(vs, fs, blending) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: blending || THREE.NormalBlending,
        uniforms: { uTime: { value: 0 }, uFade: { value: 1 } },
        vertexShader: vs, fragmentShader: fs,
      });
    }

    /* ── Sun ── real cellular-granulation plasma surface ── */
    const sunCellExpr = `p * 10.0 + vec3(uTime * 0.014, uTime * 0.010, 0.0)`;
    const sunVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime;
      ${COMMON}
      float heroHeight(vec3 p) {
        vec2 cv = cellular3(${sunCellExpr});
        return (smoothstep(0.0, 0.5, cv.x) - 0.45) * 0.045;
      }
      ${heroDisplaceMain}
    `;
    const sunCoreMat = heroMaterial(sunVS, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 V  = normalize(cameraPosition - vWP);
        float NdotV = max(dot(vN, V), 0.0);
        float fr = pow(1.0 - NdotV, 1.5);
        float pulse = 0.92 + 0.08 * sin(uTime * 2.1);
        vec3 p = vP;
        vec2 cv = cellular3(${sunCellExpr});
        float cellBright = smoothstep(0.0, 0.5, cv.x);
        float gran = mix(0.45, 1.05, cellBright) * (0.85 + cv.y * 0.3);
        float spotN = fbm3(vP * 1.6 + vec3(4.0, 1.0, 0.0));
        float spot  = smoothstep(0.58, 0.68, spotN);
        vec3 col = mix(vec3(1.0, 0.95, 0.7) * 2.2, vec3(1.0, 0.65, 0.1) * 3.5, fr * 0.7);
        col *= mix(1.0, 0.45, spot * (1.0 - fr));
        col *= (0.70 + 0.40 * gran) * pulse;
        col += vec3(1.0, 0.85, 0.5) * pow(fr, 0.6) * 0.6;
        gl_FragColor = vec4(col, uFade);
      }
    `, THREE.AdditiveBlending);
    const sunHaloMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uFade: { value: 1 } },
      vertexShader: /* glsl */ `
        varying vec3 vN;
        void main() {
          vN = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        varying vec3 vN;
        uniform float uTime, uFade;
        void main() {
          float r = pow(1.0 - abs(dot(vN, vec3(0.0, 0.0, 1.0))), 2.0);
          float p = 0.88 + 0.12 * sin(uTime * 1.8);
          gl_FragColor = vec4(vec3(1.0, 0.6, 0.1) * r * 2.5 * p, r * 0.8 * uFade);
        }
      `,
    });
    const sunGroup = new THREE.Group();
    sunGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.62, 96, 96), sunCoreMat));
    sunGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.90, 56, 56), sunHaloMat));
    solarGroup.add(sunGroup);

    /* ── Shared "rocky, cratered" body — Mercury & Mars ── */
    const rockyCraterCalls = /* glsl */ `
      craterBowl(n, normalize(vec3( 0.55, 0.35, 0.70)), 0.34, 1.0) +
      craterBowl(n, normalize(vec3(-0.45, 0.60,-0.30)), 0.22, 0.8) +
      craterBowl(n, normalize(vec3( 0.15,-0.75, 0.45)), 0.28, 0.85) +
      craterBowl(n, normalize(vec3(-0.65,-0.25,-0.55)), 0.18, 0.65) +
      craterBowl(n, normalize(vec3( 0.75,-0.15,-0.35)), 0.15, 0.55)
    `;
    const rockySmallCalc = /* glsl */ `
      vec2 scV = cellular3(p * 7.0);
      float scOn   = step(0.5, scV.y);
      float scSize = 0.28 + scV.y * 0.30;
      float scBowl = smoothstep(scSize, 0.0, scV.x);
      float scRim  = exp(-pow((scV.x - scSize * 1.15) * 14.0, 2.0));
      float small  = scOn * (scRim * 0.30 - scBowl);
    `;
    const rockyVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        vec3 n = normalize(p);
        float rough = (fbm3(p * 10.0) - 0.5) * 0.08 + (fbm3(p * 24.0) - 0.5) * 0.04;
        float craters = ${rockyCraterCalls};
        ${rockySmallCalc}
        return rough * 0.05 + craters * 0.030 + small * 0.012;
      }
      ${heroDisplaceMain}
    `;
    const rockyFS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade, uPolar;
      uniform vec3 uBaseLow, uBaseHigh;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(1.1, 0.6, 1.4));
        float lambert = max(dot(N, L), 0.0);
        vec3 n = normalize(vP);
        vec3 p = vP;

        float alt = fbm3(vP * 4.0) * 0.5 + 0.5;
        vec3 base = mix(uBaseLow, uBaseHigh, alt);

        float craters = ${rockyCraterCalls};
        base *= 1.0 - clamp(-craters, 0.0, 1.0) * 0.40;
        base += clamp(craters, 0.0, 1.0) * 0.08;

        ${rockySmallCalc}
        base *= 1.0 - clamp(-small, 0.0, 1.0) * 0.30;
        base += clamp(small, 0.0, 1.0) * 0.06;

        float polarCap = smoothstep(0.80, 0.94, abs(vP.y)) * uPolar;
        base = mix(base, vec3(0.92, 0.94, 0.98), polarCap);

        float fine = fbm3(vP * 30.0) - 0.5;
        base *= 0.92 + fine * 0.16;

        vec3 lit = base * (0.10 + lambert * 1.15);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        lit += vec3(0.55, 0.53, 0.55) * fr * 0.12;
        gl_FragColor = vec4(lit, uFade);
      }
    `;
    function makeRockyMat(baseLow, baseHigh, polar) {
      return new THREE.ShaderMaterial({
        transparent: true, depthWrite: false,
        uniforms: {
          uTime: { value: 0 }, uFade: { value: 1 }, uPolar: { value: polar },
          uBaseLow:  { value: new THREE.Vector3(...baseLow) },
          uBaseHigh: { value: new THREE.Vector3(...baseHigh) },
        },
        vertexShader: rockyVS, fragmentShader: rockyFS,
      });
    }
    const mercuryMat = makeRockyMat([0.30, 0.27, 0.24], [0.58, 0.52, 0.46], 0.0);
    const marsMat    = makeRockyMat([0.34, 0.13, 0.07], [0.68, 0.34, 0.19], 1.0);

    /* ── Venus — thick smooth swirling cloud deck, no visible surface ── */
    const venusMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(1.1, 0.6, 1.4));
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        vec3 warp = vec3(
          fbm3(p * 2.0 + vec3(1.0, 0.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 1.0, 0.0)),
          fbm3(p * 2.0 + vec3(0.0, 0.0, 1.0))
        ) - 0.5;
        vec3 wp = p + warp * 1.1;
        float bands = fbm3(wp * 3.0 + vec3(uTime * 0.01, 0.0, 0.0)) * 0.6
                    + fbm3(wp * 7.0 - vec3(0.0, uTime * 0.008, 0.0)) * 0.4;
        vec3 base = mix(vec3(0.76, 0.66, 0.40), vec3(0.95, 0.90, 0.70), bands);
        vec3 lit = base * (0.30 + lambert * 0.80);
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
        lit += vec3(1.0, 0.92, 0.68) * fr * 0.40;
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);

    /* ── Earth — kept from the realism pass: real mountains on land,
       swirling domain-warped clouds, city lights, biome-split ground ── */
    const earthLandCalc = /* glsl */ `
      float landBase = fbm3(p * 2.6 + vec3(3.1, 1.7, 0.0));
      float landEdge = fbm3(p * 7.5 + vec3(1.4, 0.2, 2.6)) * 0.16;
      float land = smoothstep(0.46, 0.52, landBase + landEdge);
    `;
    const earthCloudCalc = /* glsl */ `
      vec3 warp = vec3(
        fbm3(p * 3.0 + vec3(1.0, 0.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 1.0, 0.0)),
        fbm3(p * 3.0 + vec3(0.0, 0.0, 1.0))
      ) - 0.5;
      vec3 wp = p + warp * 0.7;
      float cloudN = fbm3(wp * 4.0 + vec3(uTime * 0.02, 0.0, 0.0))
                   * fbm3(wp * 8.0 - vec3(0.0, uTime * 0.015, 0.0));
      float cloud = smoothstep(0.28, 0.60, cloudN);
    `;
    const earthVS = /* glsl */ `
      varying vec3 vN, vWP, vP;
      ${COMMON}
      float heroHeight(vec3 p) {
        ${earthLandCalc}
        float terrain = fbm3(p * 6.0 + vec3(5.0, 2.0, 1.0)) * 0.6 + fbm3(p * 14.0) * 0.4;
        float mountains  = (terrain - 0.5) * land;
        float oceanFloor = (fbm3(p * 3.0) - 0.5) * (1.0 - land);
        return mountains * 0.028 + oceanFloor * 0.006;
      }
      ${heroDisplaceMain}
    `;
    const earthMat = heroMaterial(earthVS, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vWP);
        vec3 L = normalize(vec3(1.2, 0.5, 1.3));
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthLandCalc}
        vec3 ocean = mix(vec3(0.02, 0.10, 0.32), vec3(0.04, 0.30, 0.58), fbm3(vP * 6.0) * 0.5 + 0.5);
        float biome = fbm3(vP * 1.3 + vec3(7.0, 3.0, 1.0));
        vec3 forestCol = vec3(0.13, 0.30, 0.11);
        vec3 desertCol = vec3(0.62, 0.48, 0.26);
        vec3 groundMix = mix(forestCol, desertCol, smoothstep(0.34, 0.66, biome));
        vec3 groundFine = mix(vec3(0.85, 0.80, 1.0), vec3(1.15, 1.05, 0.85), fbm3(vP * 6.5) * 0.5 + 0.5);
        vec3 ground = groundMix * groundFine;
        vec3 surf = mix(ocean, ground, land);
        float polar = smoothstep(0.74, 0.94, abs(vP.y));
        surf = mix(surf, vec3(0.90, 0.93, 0.97), polar);
        ${earthCloudCalc}
        surf *= 1.0 - cloud * 0.22;
        float spec = pow(max(dot(reflect(-L, N), V), 0.0), 40.0) * (1.0 - land) * 0.5;
        vec3 lit = surf * (0.10 + lambert * 1.05) + vec3(1.0) * spec;
        float night = 1.0 - smoothstep(0.0, 0.16, lambert);
        vec3 cell = floor(vP * 60.0);
        float city = step(0.978, h3(cell)) * step(0.5, land) * night;
        float twinkle = 0.6 + 0.4 * sin(uTime * 3.0 + h3(cell) * 30.0);
        lit += vec3(1.0, 0.85, 0.5) * city * twinkle * 0.9;
        lit += vec3(0.02, 0.03, 0.06) * (1.0 - lambert) * 0.6;
        float fr = pow(1.0 - max(dot(N, V), 0.0), 2.4);
        lit += vec3(0.30, 0.55, 1.0) * fr * 0.5;
        gl_FragColor = vec4(lit, uFade);
      }
    `, THREE.NormalBlending);
    const cloudMat = heroMaterial(heroVS_plain, /* glsl */ `
      varying vec3 vN, vWP, vP;
      uniform float uTime, uFade;
      ${COMMON}
      void main() {
        vec3 N = normalize(vN);
        vec3 L = normalize(vec3(1.2, 0.5, 1.3));
        float lambert = max(dot(N, L), 0.0);
        vec3 p = vP;
        ${earthCloudCalc}
        gl_FragColor = vec4(vec3(1.0), cloud * (0.35 + lambert * 0.5) * uFade);
      }
    `, THREE.NormalBlending);

    /* ── Gas giants: Jupiter, Saturn, Uranus, Neptune — shared
       lighting shell, each with its own band/spot expression ── */
    function gasGiantMat(colorExpr) {
      return heroMaterial(heroVS_plain, /* glsl */ `
        varying vec3 vN, vWP, vP;
        uniform float uTime, uFade;
        ${COMMON}
        void main() {
          vec3 N = normalize(vN);
          vec3 V = normalize(cameraPosition - vWP);
          vec3 L = normalize(vec3(1.1, 0.6, 1.4));
          float lambert = max(dot(N, L), 0.0);
          ${colorExpr}
          vec3 lit = col * (0.20 + lambert * 0.95);
          float fr = pow(1.0 - max(dot(N, V), 0.0), 2.2);
          lit += vec3(0.9, 0.9, 1.0) * fr * 0.18;
          gl_FragColor = vec4(lit, uFade);
        }
      `, THREE.NormalBlending);
    }
    const jupiterMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.6 + vec3(5.0, 2.0, 0.0)) - 0.5) * 0.6;
      float bv = lat * 5.0 + warp;
      float b1 = sin(bv);
      float b2 = sin(bv * 2.3 + 1.0);
      vec3 col = mix(vec3(0.70, 0.54, 0.38), vec3(0.90, 0.78, 0.60), smoothstep(-0.3, 0.3, b1));
      col = mix(col, vec3(0.52, 0.36, 0.24), smoothstep(0.4, 0.7, b2) * 0.5);
      vec3 spotCenter = normalize(vec3(0.3, -0.15, 0.94));
      float spotD = length(normalize(vP) - spotCenter) / 0.30;
      float spot = smoothstep(1.0, 0.0, spotD);
      col = mix(col, vec3(0.70, 0.30, 0.20), spot * 0.85);
    `);
    const saturnMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.4 + vec3(3.0, 1.0, 0.0)) - 0.5) * 0.4;
      float bv = lat * 6.0 + warp;
      vec3 col = mix(vec3(0.80, 0.72, 0.52), vec3(0.94, 0.88, 0.70), smoothstep(-0.4, 0.4, sin(bv)));
      col = mix(col, vec3(0.70, 0.60, 0.42), smoothstep(0.5, 0.8, sin(bv * 1.7)) * 0.3);
    `);
    const uranusMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float bv = lat * 4.0 + (fbm3(vP * 1.2) - 0.5) * 0.3;
      vec3 col = mix(vec3(0.52, 0.83, 0.84), vec3(0.66, 0.92, 0.90), smoothstep(-0.5, 0.5, sin(bv)));
    `);
    const neptuneMat = gasGiantMat(/* glsl */ `
      float lat = vP.y / (length(vP) + 0.0001);
      float warp = (fbm3(vP * 1.5 + vec3(2.0, 4.0, 0.0)) - 0.5) * 0.5;
      float bv = lat * 5.0 + warp;
      vec3 col = mix(vec3(0.15, 0.27, 0.60), vec3(0.28, 0.42, 0.78), smoothstep(-0.4, 0.4, sin(bv)));
      vec3 spotCenter = normalize(vec3(-0.2, 0.3, 0.92));
      float spotD = length(normalize(vP) - spotCenter) / 0.20;
      float spot = smoothstep(1.0, 0.0, spotD);
      col = mix(col, vec3(0.07, 0.13, 0.28), spot * 0.7);
    `);

    /* ── Saturn's ring ── flat disc, radius-based procedural bands ── */
    function makeRing(innerR, outerR, baseCol, opac) {
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.DoubleSide,
        blending: THREE.NormalBlending,
        uniforms: {
          uInner: { value: innerR }, uOuter: { value: outerR },
          uFade: { value: 1 }, uCol: { value: new THREE.Vector3(...baseCol) },
          uOpac: { value: opac },
        },
        vertexShader: /* glsl */ `
          varying vec3 vP;
          void main() { vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: /* glsl */ `
          varying vec3 vP;
          uniform float uInner, uOuter, uFade, uOpac;
          uniform vec3 uCol;
          ${COMMON}
          void main() {
            float r = length(vP.xy);
            float t = clamp((r - uInner) / (uOuter - uInner), 0.0, 1.0);
            float band = fbm(vec2(t * 24.0, 0.0));
            float edge = smoothstep(0.0, 0.04, t) * smoothstep(1.0, 0.94, t);
            vec3 col = mix(uCol * 0.7, uCol * 1.25, band);
            gl_FragColor = vec4(col, edge * (0.30 + band * 0.5) * uOpac * uFade);
          }
        `,
      });
      const geo = new THREE.RingGeometry(innerR, outerR, 96);
      const mesh = new THREE.Mesh(geo, mat);
      return mesh;
    }

    /* ── Orbit guide rings (thin, faint) ── */
    const orbitLineMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: {},
      vertexShader: `void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `void main(){ gl_FragColor = vec4(0.65, 0.68, 0.85, 0.22); }`,
    });

    /* ── Assemble the 8 planets ──
       [name, orbitR, size, speed, tiltX, tiltZ, startAngle, mat, extras] */
    const planetDefs = [
      ['Mercury', 0.95, 0.050, 4.74, 0.02, 0.01, 0.0, mercuryMat, null],
      ['Venus',   1.25, 0.078, 3.50, 0.05, 0.03, 1.0, venusMat,   null],
      ['Earth',   1.60, 0.082, 2.98, 0.00, 0.00, 2.1, earthMat,   { cloud: true }],
      ['Mars',    1.95, 0.062, 2.41, 0.04, 0.02, 3.5, marsMat,    null],
      ['Jupiter', 2.85, 0.190, 1.31, 0.02, 0.01, 0.5, jupiterMat, null],
      ['Saturn',  3.65, 0.160, 0.97, 0.04, 0.02, 2.5, saturnMat,  { ring: true }],
      ['Uranus',  4.30, 0.115, 0.68, 0.01, 0.01, 1.5, uranusMat,  null],
      ['Neptune', 4.90, 0.108, 0.54, 0.02, 0.01, 3.8, neptuneMat, null],
    ];

    const orbitGroups = [];
    const ringMats = [];
    const labelTargets = [{ name: 'Sun', obj: sunGroup, sun: true }];

    planetDefs.forEach(([name, orbitR, size, speed, tX, tZ, startAngle, mat, extra]) => {
      const op = new THREE.Group();
      op.rotation.x = tX;
      op.rotation.z = tZ;
      solarGroup.add(op);

      const oring = new THREE.Mesh(new THREE.TorusGeometry(orbitR, 0.003, 6, 128), orbitLineMat);
      oring.rotation.x = Math.PI / 2;
      op.add(oring);

      const piv = new THREE.Group();
      piv.rotation.y = startAngle;
      op.add(piv);

      const planetGroup = new THREE.Group();
      planetGroup.position.x = orbitR;
      piv.add(planetGroup);

      const segs = size > 0.14 ? 64 : 80;
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(size, segs, segs), mat);
      mesh.userData.spin = 0.002 + Math.random() * 0.003;
      planetGroup.add(mesh);

      if (extra && extra.cloud) {
        planetGroup.add(new THREE.Mesh(new THREE.SphereGeometry(size * 1.03, 64, 64), cloudMat));
      }
      if (extra && extra.ring) {
        const ring = makeRing(size * 1.5, size * 2.5, [0.75, 0.68, 0.52], 0.85);
        ring.rotation.x = Math.PI / 2.6;
        planetGroup.add(ring);
        ringMats.push(ring.material);
      }

      orbitGroups.push({ piv, speed, mesh });
      labelTargets.push({ name, obj: planetGroup, sun: false });
    });

    /* ═══════════════════════════════════════════
       FLOATING NAME LABELS (screen-projected HTML)
    ═══════════════════════════════════════════ */
    const labelsRoot = document.getElementById('labels');
    const labelEls = labelTargets.map(({ name, sun }) => {
      const el = document.createElement('div');
      el.className = 'planetLabel' + (sun ? ' sunLabel' : '');
      el.textContent = name;
      labelsRoot.appendChild(el);
      return el;
    });
    const labelVec = new THREE.Vector3();

    /* ═══════════════════════════════════════════
       AMBIENT SOUND (synthesised, opt-in)
    ═══════════════════════════════════════════ */
    let audioCtx = null;
    function initAudio() {
      const ctx    = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -8;
      limiter.knee.value      = 18;
      limiter.ratio.value     = 12;
      limiter.attack.value    = 0.003;
      limiter.release.value   = 0.25;
      master.connect(limiter);
      limiter.connect(ctx.destination);
      master.gain.value = 0;
      master.gain.setTargetAtTime(0.32, ctx.currentTime, 2.0);

      [[42,'sine',0.42],[42.85,'sine',0.17],[84.3,'sine',0.12],
       [126,'triangle',0.055],[210,'triangle',0.03]].forEach(([f,t,g]) => {
        const o = ctx.createOscillator(), gn = ctx.createGain();
        o.type = t; o.frequency.value = f; gn.gain.value = g;
        o.connect(gn); gn.connect(master); o.start();
      });
      const buf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns   = ctx.createBufferSource();
      ns.buffer = buf; ns.loop = true;
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = 195; filt.Q.value = 3.5;
      const ng   = ctx.createGain(); ng.gain.value = 0.036;
      ns.connect(filt); filt.connect(ng); ng.connect(master); ns.start();
      const lfo  = ctx.createOscillator();
      lfo.type = 'sine'; lfo.frequency.value = 0.055;
      const lg = ctx.createGain(); lg.gain.value = 75;
      lfo.connect(lg); lg.connect(filt.frequency); lfo.start();
      [528, 531.5, 524.8, 792, 1056].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.value = i < 3 ? 0.0085 : 0.004;
        o.connect(g); g.connect(master); o.start();
      });
      return ctx;
    }
    const sndBtn = document.getElementById('sndBtn');
    sndBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = initAudio();
        sndBtn.textContent = '♪ sound on';
        sndBtn.classList.add('on');
      } else if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        sndBtn.classList.add('on');
      }
    });

    /* ═══════════════════════════════════════════
       INTERACTION — drag to orbit the view around
       the system, scroll (or pinch) to zoom
    ═══════════════════════════════════════════ */
    let isDragging = false;
    let prevMouse  = { x: 0, y: 0 };
    let rotVel     = { x: 0, y: 0 };
    let outerRot   = { x: -0.18, y: 0 };
    let zoom       = 15.5;

    window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup',   () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (isDragging) {
        rotVel.y += (e.clientX - prevMouse.x) * 0.005;
        rotVel.x += (e.clientY - prevMouse.y) * 0.005;
        prevMouse = { x: e.clientX, y: e.clientY };
      }
    });
    window.addEventListener('wheel', e => {
      zoom = Math.max(3.0, Math.min(24.0, zoom + e.deltaY * 0.008));
    }, { passive: true });

    let lastTouch = null, lastPinch = null;
    window.addEventListener('touchstart', e => {
      lastTouch = e.touches.length === 1 ? e.touches[0] : null;
    });
    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && lastTouch) {
        const t = e.touches[0];
        rotVel.y += (t.clientX - lastTouch.clientX) * 0.005;
        rotVel.x += (t.clientY - lastTouch.clientY) * 0.005;
        lastTouch = t;
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (lastPinch) zoom = Math.max(3.0, Math.min(24.0, zoom - (dist - lastPinch) * 0.02));
        lastPinch = dist;
        lastTouch = null;
      } else {
        lastPinch = null;
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { lastTouch = null; lastPinch = null; });

    window.addEventListener('resize', () => {
      camera.aspect = W() / H();
      camera.fov = restFov();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
    });

    /* ═══════════════════════════════════════════
       RENDER LOOP
    ═══════════════════════════════════════════ */
    const clock = new THREE.Clock();
    const timedMats = [
      bgMat, sunCoreMat, sunHaloMat, venusMat, earthMat, cloudMat,
      jupiterMat, saturnMat, uranusMat, neptuneMat, mercuryMat, marsMat,
      ...ringMats,
    ];
    let camZ = zoom;

    (function loop() {
      requestAnimationFrame(loop);
      const t = clock.getElapsedTime();

      cosmicGroup.rotation.y += 0.00016;
      cosmicGroup.rotation.x += 0.00007;

      asteroidPivots.forEach(({ pivot, spd, mesh }) => {
        pivot.rotation.y += spd * 0.016;
        mesh.rotation.x  += mesh.userData.rx;
        mesh.rotation.z  += mesh.userData.rz;
      });

      /* Drag rotates the whole system; a slow constant drift keeps
         it alive even with no input */
      outerRot.y += rotVel.y + 0.0011;
      outerRot.x += rotVel.x;
      outerRot.x  = Math.max(-1.1, Math.min(0.6, outerRot.x));
      rotVel.x *= 0.92;
      rotVel.y *= 0.92;
      solarGroup.rotation.set(outerRot.x, outerRot.y, 0);

      /* Planetary + self-spin motion */
      orbitGroups.forEach(({ piv, speed, mesh }, i) => {
        piv.rotation.y = planetDefs[i][6] + speed * t * 0.06;
        mesh.rotation.y += mesh.userData.spin;
      });

      /* Fade the whole scene in gently over the first couple of seconds */
      const introFade = Math.min(1, t / 2.2);
      timedMats.forEach(m => {
        if (m.uniforms?.uTime) m.uniforms.uTime.value = t;
        if (m.uniforms?.uFade) m.uniforms.uFade.value = introFade;
      });

      /* Shooting stars */
      metData.forEach((m, mi) => {
        const cy     = (t + m.phase) % m.period;
        const active = cy < ACTIVE_DUR;
        const b6 = mi * 6, b3 = mi * 3;
        if (active) {
          const prog = cy / ACTIVE_DUR;
          const hd = prog * m.speed * ACTIVE_DUR;
          const td = Math.max(0, hd - m.trail);
          const fadeIn  = Math.min(1.0, prog / 0.09);
          const fadeOut = 1.0 - Math.pow(Math.max(0.0, (prog - 0.72) / 0.28), 1.6);
          const fade    = fadeIn * fadeOut * m.bright;
          tailPos[b6]   = m.sx + m.dx * hd;
          tailPos[b6+1] = m.sy + m.dy * hd;
          tailPos[b6+2] = m.sz + m.dz * hd;
          tailPos[b6+3] = m.sx + m.dx * td;
          tailPos[b6+4] = m.sy + m.dy * td;
          tailPos[b6+5] = m.sz + m.dz * td;
          tailCol[b6]   = m.col[0] * fade; tailCol[b6+1] = m.col[1] * fade; tailCol[b6+2] = m.col[2] * fade;
          tailCol[b6+3] = 0; tailCol[b6+4] = 0; tailCol[b6+5] = 0;
          headPos[b3]   = tailPos[b6];
          headPos[b3+1] = tailPos[b6+1];
          headPos[b3+2] = tailPos[b6+2];
          headCol[b3]   = m.col[0] * fade * 3.5;
          headCol[b3+1] = m.col[1] * fade * 3.5;
          headCol[b3+2] = m.col[2] * fade * 3.5;
        } else {
          for (let k = 0; k < 6; k++) { tailPos[b6+k] = 0; tailCol[b6+k] = 0; }
          headPos[b3] = 0; headPos[b3+1] = -999; headPos[b3+2] = 0;
          headCol[b3] = 0; headCol[b3+1] = 0; headCol[b3+2] = 0;
        }
      });
      tailGeo.attributes.position.needsUpdate = true;
      tailGeo.attributes.color.needsUpdate    = true;
      headGeo.attributes.position.needsUpdate = true;
      headGeo.attributes.color.needsUpdate    = true;

      /* Smooth zoom */
      camZ += (zoom - camZ) * 0.08;
      camera.position.set(0, CAM_Y, camZ);
      camera.lookAt(0, 0, 0);
      camera.updateMatrixWorld(); /* so project() below reads this frame's move, not last frame's */

      /* Project each body to screen space for its label */
      const w = W(), h = H();
      labelTargets.forEach(({ obj }, i) => {
        obj.getWorldPosition(labelVec);
        labelVec.project(camera);
        const el = labelEls[i];
        if (labelVec.z > 1 || labelVec.z < -1) { el.style.opacity = '0'; return; }
        const x = (labelVec.x * 0.5 + 0.5) * w;
        const y = (1 - (labelVec.y * 0.5 + 0.5)) * h;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.opacity = introFade.toFixed(2);
      });

      renderer.render(scene, camera);
    })();

  })(); /* end IIFE */
  </script>
</body>
</html>
